<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#08080a;--card:rgba(255,255,255,.035);--card2:#141418;--solid:#111114;--ink:#f7f4f8;--mute:#8f8996;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--soft:rgba(255,255,255,.06);
 --acc:#ff3d8f;--acc3:#ff7ab5;--accInk:#fff;--acc2:rgba(255,61,143,.14);--grad:linear-gradient(135deg,#ff3d8f 0%,#d6339d 55%,#9b3dff 100%);
 --red:#ff6b81;--red2:rgba(255,107,129,.14);--amb:#ffc078;--amb2:rgba(255,192,120,.12);--blue:#c4b2ff;--blue2:rgba(196,178,255,.12);--okc:#ff7ab5;--r:24px}
html,body{margin:0;color:var(--ink);font:15px/1.5 Geist,Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
html{background:var(--bg)}
body{min-height:100vh;padding-bottom:110px;background:radial-gradient(900px 480px at 85% -8%,rgba(255,61,143,.20),transparent 60%),radial-gradient(700px 420px at -15% 18%,rgba(155,61,255,.13),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit}
::selection{background:var(--acc);color:#fff}
.top{position:sticky;top:0;z-index:5;background:rgba(8,8,10,.62);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:700;letter-spacing:-.03em;font-size:18px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;box-shadow:0 6px 24px -6px rgba(255,61,143,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.sync{display:block;font-size:11px;font-weight:500;color:var(--mute);letter-spacing:0}
.monthnav{display:flex;align-items:center;gap:2px;font-weight:600;font-size:13.5px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{width:30px;height:30px;border-radius:999px;border:0;background:transparent;cursor:pointer;font-size:17px;line-height:1;color:var(--ink)}
.monthnav button:hover{background:var(--soft)}
.monthnav span{min-width:108px;text-align:center}
main{max-width:760px;margin:0 auto;padding:16px 14px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;backdrop-filter:blur(8px)}
h2{font-size:15px;margin:0 0 10px;font-weight:650;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center;gap:8px}
h3{font-size:19px;margin:0;font-weight:700;letter-spacing:-.03em}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 20px 18px;margin-bottom:12px;background:var(--grad);color:#fff;box-shadow:0 20px 60px -24px rgba(255,61,143,.75),inset 0 1px 0 rgba(255,255,255,.3)}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.hero .l{font-size:12.5px;font-weight:600;opacity:.85;letter-spacing:.02em;text-transform:uppercase}
.hero .v{font-size:40px;font-weight:750;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0 2px}
.hero .sub{font-size:13px;opacity:.9}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;position:relative;z-index:1}
.hero .stats div{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:9px 10px;backdrop-filter:blur(6px)}
.hero .stats b{display:block;font-size:14.5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .stats span{font-size:11px;opacity:.85}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.tile .l{font-size:12px;color:var(--mute);font-weight:600}
.tile .v{font-size:21px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .n{font-size:12px;color:var(--mute)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list>.row:first-child{border-top:0}
.row.click,.click{cursor:pointer}
.row.click:hover .t{color:var(--acc3)}
.ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-size:18px;flex:none}
.grow{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.s{font-size:12.5px;color:var(--mute)}
.amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;letter-spacing:-.02em}
.pos{color:var(--acc3)}
.red{color:var(--red)}
.badge{font-size:11px;font-weight:650;padding:2px 9px;border-radius:99px;display:inline-block;white-space:nowrap;border:1px solid transparent}
.b-ok{background:var(--acc2);color:var(--acc3);border-color:rgba(255,61,143,.25)}.b-red{background:var(--red2);color:var(--red)}.b-amb{background:var(--amb2);color:var(--amb)}.b-blue{background:var(--blue2);color:var(--blue)}.b-mute{background:var(--soft);color:var(--mute)}
.btn{appearance:none;border:1px solid var(--line2);background:var(--soft);color:var(--ink);font-weight:600;border-radius:999px;padding:10px 16px;cursor:pointer;white-space:nowrap;transition:transform .12s,background .15s,box-shadow .15s}
.btn:hover{background:rgba(255,255,255,.1)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 24px -10px rgba(255,61,143,.8),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{color:var(--red);border-color:rgba(255,107,129,.3)}
.btn.block{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(520px,calc(100% - 20px));background:rgba(18,18,22,.72);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line2);border-radius:999px;display:flex;justify-content:space-between;padding:6px;z-index:6;box-shadow:0 18px 50px -12px rgba(0,0,0,.8)}
.tabs button{flex:1;background:none;border:0;color:var(--mute);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;cursor:pointer;border-radius:999px;transition:background .2s,color .2s}
.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:#fff;background:var(--acc2);box-shadow:inset 0 0 0 1px rgba(255,61,143,.35)}
.tabs button.on svg{stroke:var(--acc3)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:99px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:#111114;border:1px solid var(--line2);border-bottom:0;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px 26px;box-shadow:0 -20px 60px -20px rgba(255,61,143,.25);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:28px;border-bottom:1px solid var(--line2)}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.x{border:1px solid var(--line);background:var(--soft);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:14px;color:var(--ink)}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.mf .btn.pri{min-width:140px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:14px 0 6px;letter-spacing:.01em}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=month],input[type=search],select,textarea{width:100%;font:inherit;color:var(--ink);background:#0b0b0e;border:1px solid var(--line2);border-radius:14px;padding:11px 13px;min-height:44px;outline:none;transition:border-color .15s,box-shadow .15s;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,61,143,.18)}
textarea{min-height:120px;font-size:12px;font-family:ui-monospace,monospace}
input.big{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
input[type=file]{font-size:13px;color:var(--mute)}
input[type=file]::file-selector-button{font:inherit;font-weight:600;border:1px solid var(--line2);background:var(--soft);color:var(--ink);border-radius:999px;padding:8px 14px;margin-right:10px;cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:8px 13px;border-radius:99px;border:1px solid var(--line2);font-size:13px;font-weight:550;cursor:pointer;background:var(--soft);transition:.15s}
.chip span:hover{border-color:rgba(255,61,143,.5)}
.chip input:checked+span{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 18px -8px rgba(255,61,143,.9)}
.chip input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.fchips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;border:1px solid var(--line2);background:var(--soft);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:550;cursor:pointer;color:var(--ink)}
.fchips button.on{background:var(--grad);color:#fff;border-color:transparent}
.ck{display:flex;gap:9px;align-items:center;font-size:14px;margin:14px 0 6px;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;text-align:center;color:var(--mute);font-weight:600;padding-bottom:4px}
.cal .d{aspect-ratio:1/1;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13px;font-weight:600;padding:5px 2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;transition:.15s}
.cal .d:hover{border-color:rgba(255,61,143,.5)}
.cal .d.o{visibility:hidden}
.cal .d.td{border-color:var(--acc);color:var(--acc3);box-shadow:0 0 0 3px rgba(255,61,143,.15)}
.cal .d.sel{background:var(--grad);color:#fff;border-color:transparent}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:6px;max-width:100%}
.dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.callout{background:var(--blue2);border:1px solid rgba(196,178,255,.18);border-radius:20px;padding:13px 15px;margin-bottom:12px;font-size:14px}
.callout.amb{background:var(--amb2);border-color:rgba(255,192,120,.2)}
.callout.ok{background:var(--acc2);border-color:rgba(255,61,143,.25)}
.alert{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:20px;margin-bottom:8px;background:var(--card);border:1px solid var(--line)}
.alert.today{border-color:rgba(255,61,143,.45);background:var(--acc2)}
.alert.late{border-color:rgba(255,107,129,.5);background:var(--red2)}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.steps{margin:0;padding-left:20px}.steps li{margin:5px 0}
.muted{color:var(--mute)}
.small{font-size:13px}
.sep{height:1px;background:var(--line);margin:14px 0}
.sec{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:4px 4px 8px}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-16px);background:var(--grad);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center;box-shadow:0 10px 30px -10px rgba(255,61,143,.8)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.imp{max-height:46vh;overflow:auto;border:1px solid var(--line2);border-radius:16px;padding:0 12px;margin-top:10px}
.imp .row select{width:auto;min-height:34px;padding:5px 8px;font-size:13px;max-width:150px}
.dup{opacity:.45}
a{color:var(--acc3)}
.logo img.tico{width:100%;height:100%;display:block;border-radius:inherit}
.logo:has(img){background:none;padding:0;overflow:hidden}
#login{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:radial-gradient(700px 420px at 80% 0%,rgba(255,61,143,.28),transparent 60%),radial-gradient(600px 400px at 0% 100%,rgba(155,61,255,.2),transparent 60%),#08080a;overflow:auto}
.lg-card{width:100%;max-width:400px;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:28px;padding:26px 22px;backdrop-filter:blur(14px)}
input[type=password]{width:100%;font:inherit;color:var(--ink);background:#0b0b0e;border:1px solid var(--line2);border-radius:14px;padding:11px 13px;min-height:44px;outline:none}
input[type=password]:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,61,143,.18)}
button:disabled{opacity:.6;cursor:wait}
details summary{color:var(--acc3)}
</style>
</head>

function keyFromDesc(desc){let n=norm(desc);

  const parts=n.split(/\s+-\s+|\s*\|\s*/).map(p=>p.trim()).filter(Boolean);
  const junk=/^(transferencia|transf|pix|enviad[oa]|recebid[oa]|pelo|pela|via|de|do|da|para|pra|com|no|na|pagamento|pgto|compra|cartao|debito|credito|qr|code|codigo|ted|doc|em|conta|realizad[oa]|efetuad[oa]|agendad[oa])$/;
  let best='';for(const p of parts){const w=p.split(' ').filter(x=>!junk.test(x)&&!/^\d+$/.test(x)&&x.length>1);if(w.length){best=w.slice(0,3).join(' ');break}}

async function sql(q){const r=await mcp.callTool(SB.server,'execute_sql',{project_id:SB.project,query:q},{cache:false});
  let p=r&&r.payload;if(p&&typeof p==='object'&&!Array.isArray(p)&&typeof p.result==='string')p=p.result;

async function flush(){if(!sbOk)return;const ks=[...dirty].filter(k=>!inflight.has(k));if(!ks.length)return;ks.forEach(k=>{dirty.delete(k);inflight.add(k)});
  try{const docs={};ks.filter(k=>/^[a-z0-9-]{1,40}$/.test(k)).forEach(k=>docs[k]=JSON.parse(JSON.stringify(docBody(k))));
    if(Object.keys(docs).length)await bkPush(docs);fails=0}

    if(e&&e.code==='auth'){sbOk=false;savePending();showLogin('Sua sessão expirou. Entre de novo.');return}
    if(!(e&&e.retryable)&&e&&e.code!=='parse'&&e.code!=='tool_error'){sbOk=false;sbErr=errMsg(e);ks.forEach(k=>inflight.delete(k));savePending();setSync('error',sbErr);toast(sbErr);return}}

  await sql(`insert into meubolso.docs(user_id,key,body,updated_at) select o.id, v.k, v.b::jsonb, now() from (values ${vals}) v(k,b) cross join ${OWNER_SQL} o(id) on conflict (user_id,key) do update set body=excluded.body, updated_at=now() returning key`)}

function findTx(id){for(const M in S.months){const a=S.months[M].tx||[];const i=a.findIndex(t=>t.id===id);if(i>=0)return{M,i,t:a[i]}}return null}
function removeTx(id){const f=findTx(id);if(!f)return null;S.months[f.M].tx.splice(f.i,1);return 'm-'+f.M}
function allTx(){return Object.values(S.months).flatMap(m=>m.tx||[])}
function billIn(b,M){if(b.kind==='unica')return ymOf(b.date||'')===M;const st=b.start||M;if(monthDiff(st,M)<0)return false;if(b.kind==='parcelada')return monthDiff(st,M)<(Number(b.installments)||1);return true}
function billDue(b,M){if(b.kind==='unica')return b.date;return M+'-'+pad(Math.min(Number(b.dueDay)||1,dim(M)))}
function billLabel(b,M){return b.kind==='parcelada'?`${b.name} (${monthDiff(b.start,M)+1}/${b.installments})`:b.name}
const MESL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const dFull=d=>d?`${d.slice(8)}/${d.slice(5,7)}/${d.slice(0,4)}`:'';
const mExt=M=>`${MESL[Number(M.slice(5))-1]} de ${M.slice(0,4)}`;
function parcInfo(n,day,start){n=Math.max(1,parseInt(n)||1);const b={kind:'parcelada',dueDay:Math.min(31,Math.max(1,parseInt(day)||1)),start,installments:n};const endM=addMonths(start,n-1);return{first:billDue(b,start),last:billDue(b,endM),endM}}
function billsFor(M){return S.bills.items.filter(b=>billIn(b,M)).map(b=>({b,due:billDue(b,M),paid:!!(b.paid&&b.paid[M]),label:billLabel(b,M),M})).sort((x,y)=>x.due.localeCompare(y.due))}
const PRIO={alta:0,normal:1,baixa:2};
function plan(M){
  const tx=monthTx(M),td=today();
  const inc=sum(tx.filter(t=>t.type==='entrada')),out=sum(tx.filter(t=>t.type==='saida'));
  const bl=billsFor(M),unpaid=bl.filter(x=>!x.paid);
  unpaid.sort((a,b)=>{const ao=a.due<td?0:1,bo=b.due<td?0:1;if(ao!==bo)return ao-bo;const pa=PRIO[a.b.prio||'normal'],pb=PRIO[b.b.prio||'normal'];if(pa!==pb)return pa-pb;return a.due.localeCompare(b.due)});
  let rem=inc-out;
  const steps=unpaid.map(x=>{const amt=Number(x.b.amount)||0;if(rem>=amt){rem-=amt;return{...x,amt,st:'ok'}}return{...x,amt,st:'falta',falta:amt-Math.max(rem,0)}});
  const unpaidTotal=unpaid.reduce((s,x)=>s+(Number(x.b.amount)||0),0);
  const cm=ymOf(td);let days=0;if(M===cm)days=dim(M)-Number(td.slice(8))+1;else if(M>cm)days=dim(M);
  return{inc,out,saldo:inc-out,steps,unpaidTotal,proj:inc-out-unpaidTotal,days,bl}}
function alerts(){const td=today(),tm=addDays(td,1),out=[];
  S.events.items.forEach(e=>{if(e.date===td)out.push({w:'Hoje',o:1,e});else if(e.date===tm)out.push({w:'Amanhã',o:2,e})});
  [...new Set([ymOf(td),ymOf(tm)])].forEach(M=>billsFor(M).forEach(x=>{if(x.paid)return;
    if(x.due===td)out.push({w:'Hoje',o:1,x});else if(x.due===tm)out.push({w:'Amanhã',o:2,x});else if(x.due<td&&M===ymOf(td))out.push({w:'Atrasada',o:0,x})}));
  return out.sort((a,b)=>a.o-b.o||((a.e&&a.e.time)||'').localeCompare((b.e&&b.e.time)||''))}

/* ---------- navegação ---------- */
let cur=ymOf(today()),tab='inicio',txFilter='todos',txSearch='',selDay=null;
const TABS=['inicio','movimentos','contas','agenda','mais'];
function go(t){if(!TABS.includes(t))t='inicio';tab=t;if(location.hash!=='#'+t){try{history.replaceState(null,'','#'+t)}catch(e){location.hash=t}}render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.includes(h)&&h!==tab){tab=h;render()}});
$('#prevM').onclick=()=>{cur=addMonths(cur,-1);selDay=null;render()};
$('#nextM').onclick=()=>{cur=addMonths(cur,1);selDay=null;render()};

function render(){
  $('#mLabel').textContent=mLabel(cur);
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const V={inicio:vInicio,movimentos:vMov,contas:vContas,agenda:vAgenda,mais:vMais};
  const keepSearch=document.activeElement&&document.activeElement.id==='txSearch';
  $('#view').innerHTML=V[tab]();
  if(keepSearch){const i=$('#txSearch');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
  if(tab==='movimentos'){const i=$('#txSearch');if(i)i.oninput=()=>{txSearch=i.value;render()}}
}

/* ---------- views ---------- */
function txRow(t){const c=catOf(t.cat);const isIn=t.type==='entrada';
  const sub=[methodName(t.method),t.bank,t.cat==='veiculo'&&t.vehicle?(t.vehicle==='moto'?'🏍️ Moto':'🚗 Carro'):null].filter(Boolean).join(' · ');
  return `<div class="row click" data-act="editTx" data-id="${t.id}"><div class="ic">${c.i}</div><div class="grow"><div class="t">${esc(t.desc||c.n)}</div><div class="s">${esc(c.n)}${sub?' · '+esc(sub):''}</div></div>
  ${t.cat==='classificar'?'<span class="badge b-amb">classificar</span>':''}<div class="amt ${isIn?'pos':''}">${isIn?'+':'−'} ${brl(t.amount)}</div></div>`}
function alertRow(a){
  if(a.e){const e=a.e,ty=evtOf(e.type);return `<div class="alert ${a.w==='Hoje'?'today':''} row click" data-act="editEv" data-id="${e.id}" style="border-top:1px solid var(--line)"><div class="ic">${ty.i}</div><div class="grow"><div class="t">${esc(e.title)}</div><div class="s">${a.w}${e.time?' às '+e.time:''} · ${ty.n}</div></div><span class="badge ${a.w==='Hoje'?'b-ok':'b-blue'}">${a.w}</span></div>`}
  const x=a.x;return `<div class="alert ${a.w==='Atrasada'?'late':a.w==='Hoje'?'today':''}"><div class="ic">${catOf(x.b.cat).i}</div><div class="grow"><div class="t">${esc(x.label)}</div><div class="s">${a.w==='Atrasada'?'Venceu '+dShort(x.due):'Vence '+a.w.toLowerCase()} · ${brl(x.b.amount)}</div></div><button class="btn sm pri" data-act="pay" data-id="${x.b.id}" data-m="${x.M}">Paguei</button></div>`}

function vInicio(){
  const M=cur,p=plan(M),al=alerts(),tx=monthTx(M),pend=tx.filter(t=>t.cat==='classificar');
  let h='';
  if(!hasData()){
    h+=`<div class="card"><h2>👋 Vamos começar</h2><ol class="steps small">
      <li><b>Registre quanto você recebe</b> neste mês (salário, extras).</li>
      <li><b>Cadastre suas contas</b> com o dia do vencimento: dívidas, aluguel, assinaturas, parcela da moto ou do carro…</li>
      <li><b>Vincule seu banco</b> importando o extrato, ou registre cada Pix na mão.</li>
      <li>Use a <b>Agenda</b> para os dias de serviço, eventos e festas.</li></ol>
      <div class="actions" style="margin:12px 0 0"><button class="btn pri" data-act="newTx" data-type="entrada">+ Recebimento</button><button class="btn" data-act="newBill">+ Conta</button><button class="btn" data-act="import">Importar extrato</button></div></div>`}
  if(al.length)h+=`<div style="margin-bottom:6px"><div class="sec">🔔 Lembretes</div>${al.map(alertRow).join('')}</div>`;
  h+=`<div class="hero"><div class="l">Saldo de ${MESES[Number(M.slice(5))-1]}</div><div class="v">${brl(p.saldo)}</div>
    <div class="sub">${p.bl.length?(p.proj>=0?`Depois das contas sobra <b>${brl(p.proj)}</b>`:`Faltam <b>${brl(-p.proj)}</b> para pagar tudo`):'recebido − gasto'}</div>
    <div class="stats"><div><span>Recebido</span><b>${brl(p.inc)}</b></div><div><span>Gasto</span><b>${brl(p.out)}</b></div><div><span>Em aberto</span><b>${brl(p.unpaidTotal)}</b></div></div></div>`;
  h+=`<div class="actions"><button class="btn pri" data-act="newTx" data-type="saida">+ Pix / gasto</button><button class="btn" data-act="newTx" data-type="entrada">+ Recebimento</button><button class="btn" data-act="import">Importar extrato</button></div>`;
  // plano
  h+=`<div class="card"><h2>🧭 O que pagar em ${MESES[Number(M.slice(5))-1]}</h2>`;
  if(!p.bl.length)h+=`<div class="empty">Nenhuma conta para este mês. Cadastre suas contas e eu monto a ordem de pagamento.</div><button class="btn sm" data-act="newBill">+ Cadastrar conta</button>`;
  else if(!p.steps.length)h+=`<div class="callout ok" style="margin:0">✅ Todas as ${p.bl.length} contas deste mês estão pagas.</div>`;
  else{
    if(p.inc===0)h+=`<div class="callout amb">Registre quanto você recebe neste mês para eu calcular o que cabe no seu dinheiro. <button class="btn sm" data-act="newTx" data-type="entrada" style="margin-top:8px">+ Recebimento</button></div>`;
    h+=`<div class="list">`+p.steps.map((x,i)=>{const late=x.due<today();
      const badge=x.st==='ok'?(late?'<span class="badge b-red">Atrasada — pague já</span>':`<span class="badge b-ok">Pague até ${dShort(x.due)}</span>`):`<span class="badge b-amb">Faltam ${brl(x.falta)}</span>`;
      return `<div class="row"><div class="ic" style="font-size:14px;font-weight:800">${i+1}º</div><div class="grow"><div class="t">${catOf(x.b.cat).i} ${esc(x.label)}</div><div class="s">${late?'Venceu':'Vence'} ${dNice(x.due)} · ${badge}</div></div><div style="text-align:right"><div class="amt">${brl(x.amt)}</div><button class="btn sm" data-act="pay" data-id="${x.b.id}" data-m="${M}" style="margin-top:4px">Paguei</button></div></div>`}).join('')+`</div>`;
    h+=`<div class="sep"></div>`;
    if(p.proj>=0){h+=`<div class="small">Depois de pagar todas as contas, sobra <b class="pos">${brl(p.proj)}</b>.`;
      if(p.days>0)h+=` Para não apertar, gaste no máximo <b>${brl(p.proj/p.days)} por dia</b> nos ${p.days} dia(s) que faltam.`;h+=`</div>`}
    else{const low=p.steps.filter(x=>(x.b.prio||'normal')==='baixa');
      h+=`<div class="small">⚠️ Faltam <b class="red">${brl(-p.proj)}</b> para pagar tudo. Pague primeiro as que estão no topo (atrasadas e prioridade alta)${low.length?`; dá para cortar ou adiar: ${low.map(x=>esc(x.b.name)).join(', ')}`:''}. Dívidas que não cabem: tente negociar parcela menor.</div>`}
  }
  h+=`</div>`;
  if(pend.length)h+=`<div class="callout amb">❓ <b>${pend.length} lançamento(s) sem categoria</b> (Pix que não deu para identificar, como iFood ou 99 pagos por intermediário). <button class="btn sm" data-act="classify" style="margin-top:8px">Classificar agora</button></div>`;
  // categorias
  const by={};tx.filter(t=>t.type==='saida').forEach(t=>{by[t.cat]=(by[t.cat]||0)+(Number(t.amount)||0)});
  const ents=Object.entries(by).sort((a,b)=>b[1]-a[1]);const mx=ents.length?ents[0][1]:0;
  h+=`<div class="card"><h2>📊 Para onde foi o dinheiro</h2>`;
  if(!ents.length)h+=`<div class="empty">Nenhum gasto registrado neste mês.</div>`;
  else h+=ents.map(([id,v])=>{const c=catOf(id);let extra='';
    if(id==='veiculo'){const mo=sum(tx.filter(t=>t.cat==='veiculo'&&t.vehicle==='moto')),ca=sum(tx.filter(t=>t.cat==='veiculo'&&t.vehicle==='carro'));if(mo||ca)extra=`<div class="s">🏍️ Moto ${brl(mo)} · 🚗 Carro ${brl(ca)}</div>`}
    return `<div style="margin:10px 0" class="click" data-act="filterGo" data-f="${id}"><div style="display:flex;justify-content:space-between;gap:8px"><span class="small" style="font-weight:600">${c.i} ${c.n}</span><span class="amt small">${brl(v)}${p.inc?` <span class="muted" style="font-weight:500">· ${v/p.inc<0.01?'&lt;1':Math.round(v/p.inc*100)}%</span>`:''}</span></div><div class="bar"><i style="width:${Math.max(3,v/mx*100)}%;background:${c.c}"></i></div>${extra}</div>`}).join('');
  h+=`</div>`;
  // próximos eventos
  const td=today(),lim=addDays(td,7);const up=S.events.items.filter(e=>e.date>=td&&e.date<=lim).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,6);
  h+=`<div class="card"><h2>📅 Próximos 7 dias <button class="btn sm" data-act="newEv">+ Evento</button></h2>`;
  h+=up.length?`<div class="list">${up.map(evRow).join('')}</div>`:`<div class="empty">Nada na agenda para os próximos dias.</div>`;
  h+=`</div>`;
  return h}

function vMov(){
  const tx=monthTx(cur).slice().sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
  const cnt={};tx.forEach(t=>{const k=t.type==='entrada'?'entradas':t.cat;cnt[k]=(cnt[k]||0)+1});
  const chips=[['todos','Todos'],['entradas','💰 Entradas'],['classificar','❓ A classificar'],...CATS.filter(c=>c.id!=='classificar').map(c=>[c.id,c.i+' '+c.n])].filter(([k])=>k==='todos'||cnt[k]||k===txFilter);
  let list=tx.filter(t=>txFilter==='todos'||(txFilter==='entradas'?t.type==='entrada':t.type==='saida'&&t.cat===txFilter));
  if(txSearch){const q=norm(txSearch);list=list.filter(t=>norm(t.desc+' '+catOf(t.cat).n+' '+(t.bank||'')).includes(q))}
  let h=`<div class="actions"><button class="btn pri" data-act="newTx" data-type="saida">+ Pix / gasto</button><button class="btn" data-act="newTx" data-type="entrada">+ Recebimento</button><button class="btn" data-act="import">Importar extrato</button></div>`;
  h+=`<input type="search" id="txSearch" placeholder="Buscar (ex.: ifood, posto, João)" value="${esc(txSearch)}" style="margin-bottom:10px">`;
  h+=`<div class="fchips">${chips.map(([k,n])=>`<button class="${txFilter===k?'on':''}" data-act="filter" data-f="${k}">${n}${k!=='todos'&&cnt[k]?' · '+cnt[k]:''}</button>`).join('')}</div>`;
  const tot=sum(list.filter(t=>t.type==='saida')),tin=sum(list.filter(t=>t.type==='entrada'));
  h+=`<div class="s" style="margin:0 2px 8px">${list.length} lançamento(s) · saídas ${brl(tot)}${tin?' · entradas '+brl(tin):''}</div>`;
  if(!list.length)return h+`<div class="card"><div class="empty">Nada por aqui em ${mLabel(cur)}.</div></div>`;
  const groups={};list.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t)});
  h+=Object.keys(groups).sort().reverse().map(d=>`<div class="card" style="padding:6px 14px"><div class="s" style="font-weight:700;padding-top:8px">${dNice(d)}</div><div class="list">${groups[d].map(txRow).join('')}</div></div>`).join('');
  return h}

function vContas(){
  const bl=billsFor(cur),paid=bl.filter(x=>x.paid),open=bl.filter(x=>!x.paid);const td=today();
  let h=`<div class="tiles"><div class="tile"><div class="l">Contas do mês</div><div class="v">${brl(bl.reduce((s,x)=>s+(+x.b.amount||0),0))}</div><div class="n">${bl.length} conta(s)</div></div><div class="tile"><div class="l">Já pago</div><div class="v pos">${brl(paid.reduce((s,x)=>s+(+x.b.amount||0),0))}</div><div class="n">${paid.length} paga(s)</div></div></div>`;
  h+=`<div class="actions"><button class="btn pri" data-act="newBill">+ Nova conta</button></div>`;
  const row=x=>{const late=!x.paid&&x.due<td;const st=x.paid?'<span class="badge b-ok">Paga</span>':late?'<span class="badge b-red">Atrasada</span>':x.due===td?'<span class="badge b-amb">Vence hoje</span>':`<span class="badge b-mute">Vence ${dShort(x.due)}</span>`;
    const pr=x.b.prio==='alta'?' · prioridade alta':x.b.prio==='baixa'?' · prioridade baixa':'';
    return `<div class="row click" data-act="editBill" data-id="${x.b.id}"><div class="ic">${catOf(x.b.cat).i}</div><div class="grow"><div class="t">${esc(x.label)}</div><div class="s">${st} · ${catOf(x.b.cat).n}${pr}</div></div><div style="text-align:right"><div class="amt">${brl(x.b.amount)}</div>${x.paid?`<button class="btn sm" data-act="unpay" data-id="${x.b.id}" data-m="${cur}" style="margin-top:4px">Desfazer</button>`:`<button class="btn sm pri" data-act="pay" data-id="${x.b.id}" data-m="${cur}" style="margin-top:4px">Paguei</button>`}</div></div>`};
  h+=`<div class="card"><h2>Em aberto · ${brl(open.reduce((s,x)=>s+(+x.b.amount||0),0))}</h2>${open.length?`<div class="list">${open.map(row).join('')}</div>`:'<div class="empty">Nenhuma conta em aberto neste mês.</div>'}</div>`;
  if(paid.length)h+=`<div class="card"><h2>Pagas</h2><div class="list">${paid.map(row).join('')}</div></div>`;
  // dívidas parceladas
  const parc=S.bills.items.filter(b=>b.kind==='parcelada');
  if(parc.length){h+=`<div class="card"><h2>💳 Dívidas e parcelamentos</h2><div class="list">${parc.map(b=>{const n=+b.installments||1;let left=0;for(let i=0;i<n;i++){const M=addMonths(b.start,i);if(!(b.paid&&b.paid[M]))left++}
    const end=addMonths(b.start,n-1);const pi=parcInfo(n,b.dueDay,b.start);return `<div class="row click" data-act="editBill" data-id="${b.id}"><div class="ic">${catOf(b.cat).i}</div><div class="grow"><div class="t">${esc(b.name)}</div><div class="s">${left?`faltam ${left} de ${n} parcelas de ${brl(b.amount)} · paga todo dia ${b.dueDay}`:'quitada ✅'}</div>${left?`<div class="s">Última parcela: <b style="color:var(--ink)">${dFull(pi.last)}</b> (${mExt(pi.endM)})</div>`:''}</div><div class="amt">${brl(left*(+b.amount||0))}</div></div>`}).join('')}</div></div>`}
  const others=S.bills.items.filter(b=>!billIn(b,cur));
  if(others.length)h+=`<div class="card"><h2>Outras contas cadastradas</h2><div class="list">${others.map(b=>`<div class="row click" data-act="editBill" data-id="${b.id}"><div class="ic">${catOf(b.cat).i}</div><div class="grow"><div class="t">${esc(b.name)}</div><div class="s">${b.kind==='unica'?'Única · '+dShort(b.date)+'/'+String(b.date).slice(0,4):b.kind==='parcelada'?'Parcelada · começa '+mLabel(b.start).toLowerCase():'Mensal · começa '+mLabel(b.start).toLowerCase()}</div></div><div class="amt">${brl(b.amount)}</div></div>`).join('')}</div></div>`;
  return h}

function evRow(e){const ty=evtOf(e.type);return `<div class="row click" data-act="editEv" data-id="${e.id}"><div class="ic" style="background:${ty.c}22">${ty.i}</div><div class="grow"><div class="t">${esc(e.title)}</div><div class="s">${dNice(e.date)}${e.time?' · '+e.time+(e.endTime?'–'+e.endTime:''):''} · ${ty.n}</div></div></div>`}
function vAgenda(){
  const M=cur,n=dim(M),first=wday(M+'-01'),td=today();
  const evs=S.events.items.filter(e=>ymOf(e.date)===M);const bl=billsFor(M);
  let h=`<div class="actions"><button class="btn pri" data-act="newEv" data-date="${selDay||''}">+ Evento / dia de serviço</button></div>`;
  h+=`<div class="card"><div class="cal">${WD.map(w=>`<div class="h">${w[0]}</div>`).join('')}`;
  for(let i=0;i<first;i++)h+=`<div class="d o"></div>`;
  for(let d=1;d<=n;d++){const ds=M+'-'+pad(d);const de=evs.filter(e=>e.date===ds);const db_=bl.filter(x=>x.due===ds&&!x.paid);
    h+=`<div class="d ${ds===td?'td':''} ${ds===selDay?'sel':''}" data-act="day" data-date="${ds}"><span>${d}</span><span class="dots">${de.slice(0,4).map(e=>`<i style="background:${evtOf(e.type).c}"></i>`).join('')}${db_.length?`<i style="background:${BILLDOT};border-radius:2px"></i>`:''}</span></div>`}
  h+=`</div><div class="legend">${EVT.map(e=>`<span><i style="background:${e.c}"></i>${e.n}</span>`).join('')}<span><i style="background:${BILLDOT};border-radius:2px"></i>Conta a pagar</span></div></div>`;
  const dayEv=selDay?evs.filter(e=>e.date===selDay):evs;const dayBl=selDay?bl.filter(x=>x.due===selDay):bl.filter(x=>!x.paid);
  const items=[...dayEv.map(e=>({k:e.date+(e.time||'00:00'),h:evRow(e)})),...dayBl.map(x=>({k:x.due+'99',h:`<div class="row click" data-act="editBill" data-id="${x.b.id}"><div class="ic">${catOf(x.b.cat).i}</div><div class="grow"><div class="t">${esc(x.label)}</div><div class="s">${dNice(x.due)} · conta${x.paid?' · paga ✅':''}</div></div><div class="amt">${brl(x.b.amount)}</div></div>`}))].sort((a,b)=>a.k.localeCompare(b.k));
  const nServ=evs.filter(e=>e.type==='servico').length;

  h+=`<div class="card"><h2>💾 Seus dados</h2><div class="small muted" style="margin-bottom:10px">${sbOk?(MODE==='hosted'?'Seus dados ficam guardados na nuvem, só na sua conta, e aparecem em qualquer aparelho em que você entrar.':'Os dados ficam salvos no seu <b>Supabase</b> (esquema <b>meubolso</b>) e aparecem em qualquer aparelho em que você abrir este app.'):'Sem conexão com o Supabase agora: os dados ficam guardados neste aparelho e sobem sozinhos quando a conexão voltar.'}</div>

function openModal(html,mount){$('#sheet').innerHTML=html;$('#modal').classList.remove('hidden');document.body.style.overflow='hidden';if(mount)mount($('#sheet'));const f=$('#sheet input:not([type=hidden]):not([type=radio]):not([type=checkbox])');if(f&&window.innerWidth>700)f.focus()}
function closeModal(){$('#modal').classList.add('hidden');$('#sheet').innerHTML='';document.body.style.overflow=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))closeModal()});
const head=t=>`<div class="mh"><h3>${t}</h3><button type="button" class="x" data-act="close" aria-label="Fechar">✕</button></div>`;
const radio=(name,val,label,curv)=>`<label class="chip"><input type="radio" name="${name}" value="${val}" ${curv===val?'checked':''}><span>${label}</span></label>`;
function confirmBox(msg,yes,fn,danger=true){openModal(`${head('Confirmar')}<div>${msg}</div><div class="mf"><button class="btn" data-act="close">Cancelar</button><button class="btn ${danger?'danger':'pri'}" id="cfYes">${yes}</button></div>`,s=>{$('#cfYes',s).onclick=()=>{closeModal();fn()}})}
const defDate=()=>ymOf(today())===cur?today():cur+'-01';
const radioVal=(f,n)=>{const r=f.querySelector(`input[name="${n}"]:checked`);return r?r.value:''};

/* ---------- lançamento ---------- */
function addRule(kw,cat){kw=norm(kw);if(!kw||cat==='classificar')return[];S.settings.rules=(S.settings.rules||[]).filter(r=>r.kw!==kw);S.settings.rules.unshift({kw,cat});
  const keys=new Set(['settings']);for(const M in S.months)(S.months[M].tx||[]).forEach(t=>{if(t.type==='saida'&&t.cat==='classificar'&&kwMatch(norm(t.desc),kw)){t.cat=cat;keys.add('m-'+M)}});return[...keys]}
function openTx(id,preset={}){

  const t=f?{...f.t}:{type:preset.type||'saida',amount:'',date:defDate(),desc:'',cat:preset.type==='entrada'?'salario':'classificar',method:'pix',vehicle:'',bank:''};

   <label class="f">Valor (R$)</label><input type="text" class="big" name="amount" inputmode="decimal" placeholder="0,00" value="${t.amount!==''?fmtNum(t.amount):''}" required autocomplete="off">
   <label class="f">Descrição</label><input type="text" name="desc" placeholder="Ex.: Pix para João, iFood, gasolina" value="${esc(t.desc)}" autocomplete="off">

   <div id="catIn"><label class="f">Tipo de recebimento</label><div class="chips">${INC.map(c=>radio('catI',c.id,c.i+' '+c.n,t.type==='entrada'?t.cat:'salario')).join('')}</div></div>
   <div id="vehRow"><label class="f">Qual veículo?</label><div class="chips">${radio('vehicle','moto','🏍️ Moto',t.vehicle)}${radio('vehicle','carro','🚗 Carro',t.vehicle)}</div></div>
   ${id?'':`<div id="parcRow"><label class="ck"><input type="checkbox" name="parc"> 💳 Compra ou conta parcelada</label>
    <div id="parcBox" style="display:none"><div class="chips">${radio('pmode','total','O valor acima é o total','total')}${radio('pmode','parcela','O valor acima é de cada parcela','total')}</div>
    <div class="g2"><div><label class="f">Nº de parcelas</label><input type="number" name="pn" min="2" max="480" value="10" inputmode="numeric"></div><div><label class="f">Dia de pagamento</label><input type="number" name="pday" min="1" max="31" inputmode="numeric" value="${Number(t.date.slice(8))}"></div></div>
    <label class="f">1ª parcela vence em</label><input type="month" name="pstart" value="${ymOf(t.date)}">
    <label class="ck"><input type="checkbox" name="ppaid"> Já paguei a 1ª parcela</label>
    <div id="parcPrev" class="callout ok small" style="margin:10px 0 0"></div></div></div>`}
   <div id="remRow"><label class="ck"><input type="checkbox" name="remember"> Sempre usar esta categoria quando a descrição tiver:</label><input type="text" name="kw" value="${esc(keyFromDesc(t.desc))}" placeholder="palavra-chave"></div>
   <div class="mf">${id?'<button type="button" class="btn danger" id="delTx">Excluir</button>':''}<button class="btn pri" type="button" data-submit="1">Salvar</button></div></form>`,s=>{
    const fm=$('#fTx',s);
    const sync=()=>{const ty=radioVal(fm,'type');$('#catOut',s).style.display=ty==='saida'?'':'none';$('#catIn',s).style.display=ty==='entrada'?'':'none';
      $('#vehRow',s).style.display=ty==='saida'&&radioVal(fm,'catO')==='veiculo'?'':'none';$('#remRow',s).style.display=ty==='saida'?'':'none';
      const pr=$('#parcRow',s);if(pr){pr.style.display=ty==='saida'?'':'none';const on=ty==='saida'&&fm.parc.checked;$('#parcBox',s).style.display=on?'':'none';
        $('[data-submit]',s).textContent=on?'Salvar parcelamento':'Salvar';

          const st=fm.pstart.value||ymOf(fm.date.value||today());const pi=parcInfo(n,fm.pday.value,st);
          $('#parcPrev',s).innerHTML=v>0?`<b>${n}x de ${brl(Math.round(per*100)/100)}</b> · total ${brl(tot)}<br>1ª parcela: <b>${dNice(pi.first)}/${pi.first.slice(0,4)}</b><br>Última parcela: <b>${dNice(pi.last)}/${pi.last.slice(0,4)}</b><br>✅ Termina de pagar em <b>${mExt(pi.endM)}</b>`:'Digite o valor para ver as parcelas.'}}};
    sync();fm.addEventListener('input',e=>{if(['amount','pn','pday','pstart'].includes(e.target.name))sync()});
    fm.addEventListener('change',e=>{if(e.target.name==='catO'||e.target.name==='catI')picked=true;sync()});
    fm.desc.addEventListener('input',()=>{fm.kw.value=keyFromDesc(fm.desc.value);if(picked)return;const ty=radioVal(fm,'type');const g=guessCat(fm.desc.value,ty);const r=fm.querySelector(`input[name="${ty==='saida'?'catO':'catI'}"][value="${g}"]`);if(r)r.checked=true;sync()});
    fm.onsubmit=e=>{e.preventDefault();const amount=Math.abs(parseMoney(fm.amount.value));if(!(amount>0)){toast('Informe um valor');fm.amount.focus();return}
      if(!fm.date.value){toast('Escolha a data');return}

      if(!id&&ty==='saida'&&fm.parc&&fm.parc.checked){const n=parseInt(fm.pn.value);if(!(n>=2&&n<=480)){toast('Nº de parcelas entre 2 e 480');return}
        const day=parseInt(fm.pday.value);if(!(day>=1&&day<=31)){toast('Dia de pagamento entre 1 e 31');return}const st=fm.pstart.value;if(!st){toast('Escolha o mês da 1ª parcela');return}
        const per=Math.round((radioVal(fm,'pmode')==='parcela'?amount:amount/n)*100)/100;

          prio:cat==='dividas'?'alta':'normal',vehicle:cat==='veiculo'?radioVal(fm,'vehicle'):'',dueDay:day,start:st,installments:n,date:fm.date.value,paid:{},bought:fm.date.value};
        const keys=['bills'];S.bills.items.push(b);
        if(fm.ppaid.checked){const t1={id:uid(),type:'saida',amount:per,date:fm.date.value,desc:billLabel(b,st),cat:b.cat,method:fm.method.value,vehicle:b.vehicle,billId:b.id,src:'conta'};b.paid[st]=t1.id;keys.push(addTx(t1))}
        if(fm.remember.checked&&fm.kw.value.trim())keys.push(...addRule(fm.kw.value,b.cat));
        const pi=parcInfo(n,day,st);save(keys);closeModal();render();
        openModal(`${head('Parcelamento salvo ✅')}<div class="callout ok"><b>${esc(b.name)}</b><br>${n}x de ${brl(per)} (total ${brl(b.total)})<br>Paga todo dia <b>${day}</b><br>1ª parcela: <b>${dFull(pi.first)}</b><br>Última parcela: <b>${dFull(pi.last)}</b><br>Termina de pagar em <b>${mExt(pi.endM)}</b></div><div class="small muted">Cada parcela aparece em <b>Contas</b> e no plano “O que pagar” do mês, e entra nos lembretes.</div><div class="mf"><button class="btn pri" data-act="close">Ok</button></div>`);return}
      const nt={...t,id:t.id||uid(),type:ty,amount:Math.round(amount*100)/100,desc:fm.desc.value.trim(),date:fm.date.value,method:fm.method.value,cat,vehicle:cat==='veiculo'?radioVal(fm,'vehicle'):'',src:t.src||'manual'};
      const keys=[];if(id)keys.push(removeTx(id));keys.push(addTx(nt));
      if(ty==='saida'&&fm.remember.checked&&fm.kw.value.trim())keys.push(...addRule(fm.kw.value,cat));
      save(keys);closeModal();render();toast(id?'Lançamento atualizado':'Lançamento salvo')};
    const del=$('#delTx',s);if(del)del.onclick=()=>confirmBox('Excluir este lançamento?','Excluir',()=>{const keys=[removeTx(id)];const b=S.bills.items.find(b=>b.paid&&Object.values(b.paid).includes(id));if(b){for(const k in b.paid)if(b.paid[k]===id)delete b.paid[k];keys.push('bills')}save(keys);render();toast('Excluído')});
  })}

   <div class="mf">${id?'<button type="button" class="btn danger" id="delBill">Excluir</button>':''}<button class="btn pri" type="button" data-submit="1">Salvar</button></div></form>`,s=>{

function openPay(billId,M){M=M||cur;const b=S.bills.items.find(x=>x.id===billId);if(!b)return;const due=billDue(b,M);
  openModal(`<form novalidate id="fPay">${head('Registrar pagamento')}<div class="t">${catOf(b.cat).i} ${esc(billLabel(b,M))}</div><div class="s">Vence ${dNice(due)}</div>

   <div class="g2"><div><label class="f">Data do pagamento</label><input type="date" name="date" value="${ymOf(today())===M||today()>due?today():due}" required></div><div><label class="f">Forma</label><select name="method">${METHODS.map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select></div></div>
   <div class="mf"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" type="button" data-submit="1">Confirmar pagamento</button></div></form>`,s=>{
    const fm=$('#fPay',s);fm.onsubmit=e=>{e.preventDefault();const amount=Math.abs(parseMoney(fm.amount.value));if(!(amount>0)){toast('Informe um valor');return}
      const t={id:uid(),type:'saida',amount:Math.round(amount*100)/100,date:fm.date.value,desc:billLabel(b,M),cat:b.cat,method:fm.method.value,vehicle:b.vehicle||'',billId:b.id,src:'conta'};
      b.paid=b.paid||{};b.paid[M]=t.id;save('bills',addTx(t));closeModal();render();toast('Pagamento registrado ✅')}})}
function unpay(billId,M){M=M||cur;const b=S.bills.items.find(x=>x.id===billId);if(!b||!b.paid||!b.paid[M])return;
  confirmBox('Desfazer o pagamento desta conta? O lançamento do pagamento também será removido.','Desfazer',()=>{const tid=b.paid[M];delete b.paid[M];const k=removeTx(tid);save('bills',k);render();toast('Pagamento desfeito')})}

/* ---------- agenda ---------- */
function openEvent(id,date){
  const e0=id?S.events.items.find(e=>e.id===id):null;if(id&&!e0)return;
  const e=e0?{...e0}:{title:'',type:'servico',date:date||defDate(),time:'',endTime:'',notes:''};
  openModal(`<form novalidate id="fEv">${head(id?'Editar evento':'Novo evento')}
   <label class="f">Tipo</label><div class="chips">${EVT.map(t=>radio('type',t.id,t.i+' '+t.n,e.type)).join('')}</div>
   <label class="f">Título</label><input type="text" name="title" value="${esc(e.title)}" placeholder="Ex.: Plantão, Show, Aniversário da Ana" required>
   <div class="g2"><div><label class="f">Data</label><input type="date" name="date" value="${e.date}" required></div><div class="g2" style="gap:6px"><div><label class="f">Início</label><input type="time" name="time" value="${e.time||''}"></div><div><label class="f">Fim</label><input type="time" name="endTime" value="${e.endTime||''}"></div></div></div>
   ${id?'':`<label class="f">Repetir</label><select name="rep"><option value="nao">Não repetir</option><option value="semanal">Toda semana</option><option value="12x36">Escala 12x36 (dia sim, dia não)</option><option value="24x48">Escala 24x48 (a cada 3 dias)</option><option value="quinzenal">A cada 15 dias</option><option value="mensal">Todo mês</option></select>
   <div id="untilRow" style="display:none"><label class="f">Repetir até</label><input type="date" name="until" value="${addMonthsDate(e.date,3)}"></div>`}
   <label class="f">Anotações</label><input type="text" name="notes" value="${esc(e.notes||'')}" placeholder="Local, horário, o que levar…">
   <div class="small muted" style="margin-top:10px">🔔 Você será avisado um dia antes e no dia.</div>
   <div class="mf">${id?`<button type="button" class="btn danger" id="delEv">Excluir</button>`:''}<button class="btn pri" type="button" data-submit="1">Salvar</button></div></form>`,s=>{
    const fm=$('#fEv',s);
    if(fm.rep)fm.rep.onchange=()=>{$('#untilRow',s).style.display=fm.rep.value==='nao'?'none':''};
    fm.addEventListener('change',ev=>{if(ev.target.name==='type'&&!fm.title.value){const t=evtOf(ev.target.value);if(t.id==='servico')fm.title.placeholder='Ex.: Plantão, Turno da noite'}});
    fm.onsubmit=ev=>{ev.preventDefault();if(!fm.title.value.trim()){toast('Dê um título ao evento');fm.title.focus();return}if(!fm.date.value){toast('Escolha a data');return}const base={type:radioVal(fm,'type')||'outro',title:fm.title.value.trim(),time:fm.time.value,endTime:fm.endTime.value,notes:fm.notes.value.trim()};
      if(id){Object.assign(e0,base,{date:fm.date.value});save('events');closeModal();render();toast('Evento atualizado');return}
      const rep=fm.rep.value,start=fm.date.value,until=fm.until.value||start;const dates=[start];
      if(rep!=='nao'){const step={semanal:7,'12x36':2,'24x48':3,quinzenal:14}[rep];let d=start;
        for(let i=1;i<=370;i++){d=rep==='mensal'?addMonthsDate(start,i):addDays(d,step);if(d>until)break;dates.push(d)}}
      const sid=dates.length>1?uid():'';dates.forEach(d=>S.events.items.push({...base,id:uid(),date:d,seriesId:sid}));
      S.events.items.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
      save('events');closeModal();cur=ymOf(start);render();toast(dates.length>1?`${dates.length} eventos criados`:'Evento salvo')};
    const del=$('#delEv',s);if(del)del.onclick=()=>{
      if(e0.seriesId){openModal(`${head('Excluir evento')}<div>Este evento faz parte de uma repetição.</div><div class="mf"><button class="btn" id="d1">Só este</button><button class="btn danger" id="d2">Este e os próximos</button></div>`,s2=>{
        $('#d1',s2).onclick=()=>{S.events.items=S.events.items.filter(x=>x.id!==id);save('events');closeModal();render();toast('Excluído')};
        $('#d2',s2).onclick=()=>{S.events.items=S.events.items.filter(x=>!(x.seriesId===e0.seriesId&&x.date>=e0.date));save('events');closeModal();render();toast('Repetição excluída')}})}
      else confirmBox('Excluir este evento?','Excluir',()=>{S.events.items=S.events.items.filter(x=>x.id!==id);save('events');render();toast('Excluído')})};
  })}

/* ---------- importação de extrato ---------- */
function splitCSV(line,dl){const out=[];let cur_='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){cur_+='"';i++}else q=false}else cur_+=ch}else if(ch==='"')q=true;else if(ch===dl){out.push(cur_);cur_=''}else cur_+=ch}out.push(cur_);return out.map(s=>s.trim())}
function parseOFX(txt){const rows=[];const re=/<STMTTRN>([\s\S]*?)(?:<\/STMTTRN>|(?=<STMTTRN>)|<\/BANKTRANLIST>)/gi;let m;
  const g=(b,tag)=>{const r=b.match(new RegExp('<'+tag+'>([^<\\r\\n]*)','i'));return r?r[1].trim():''};
  while(m=re.exec(txt)){const b=m[1];const v=parseMoney(g(b,'TRNAMT'));const date=parseDate(g(b,'DTPOSTED'));if(isNaN(v)||!date)continue;
    const desc=[g(b,'NAME'),g(b,'MEMO')].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join(' - ');
    rows.push({date,amount:Math.abs(v),type:v<0?'saida':'entrada',desc:desc||g(b,'TRNTYPE'),fitid:g(b,'FITID')})}
  return rows}
function parseCSV(txt){const lines=txt.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
  const dl=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length&&lines[0].includes(';')?';':(lines[0].includes('\t')?'\t':',');
  let hi=lines.findIndex(l=>/data|date/i.test(l)&&/valor|amount|value|quantia/i.test(l));let H=hi>=0?splitCSV(lines[hi],dl).map(norm):null;
  let di=-1,vi=-1,ti=-1,ii=-1,card=false,deb=-1,cre=-1;
  if(H){di=H.findIndex(h=>/^data|date/.test(h));vi=H.findIndex(h=>/valor|amount|value|quantia/.test(h));ti=H.findIndex(h=>/descri|title|histor|memo|lancamento|estabelecimento|detalhe/.test(h));ii=H.findIndex(h=>/^identificador|^id$|fitid/.test(h));
    card=H.includes('title')&&H.includes('amount');deb=H.findIndex(h=>/^debito|saida/.test(h));cre=H.findIndex(h=>/^credito|entrada/.test(h))}
  const body=lines.slice(hi>=0?hi+1:0);const rows=[];
  for(const l of body){const c=splitCSV(l,dl);let date=null,v=NaN,desc='';
    if(di>=0){date=parseDate(c[di]);if(vi>=0&&c[vi]!==undefined&&c[vi]!=='')v=parseMoney(c[vi]);else if(deb>=0||cre>=0){const d_=parseMoney(c[deb]),c_=parseMoney(c[cre]);v=!isNaN(c_)&&c_?Math.abs(c_):!isNaN(d_)?-Math.abs(d_):NaN}
      desc=ti>=0?c[ti]:c.filter((x,i)=>i!==di&&i!==vi).sort((a,b)=>b.length-a.length)[0]||''}
    else{for(const x of c){if(!date&&parseDate(x)){date=parseDate(x);continue}if(isNaN(v)&&/^[-+R$\s(]*\d[\d.,]*\)?$/.test(x)&&/[.,]\d{2}\)?$/.test(x)){v=parseMoney(x);continue}if(x.length>desc.length)desc=x}}
    if(!date||isNaN(v)||v===0)continue;if(card)v=-v;
    rows.push({date,amount:Math.abs(v),type:v<0?'saida':'entrada',desc:desc||'Lançamento',fitid:ii>=0?c[ii]:''})}
  return rows}
async function readText(file){const buf=await file.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}}
let IMP=null;
function openImport(bank){
  const banks=S.settings.banks||[];
  openModal(`<div>${head('Importar extrato do banco')}
   <div class="callout small" style="margin-bottom:6px">No app do seu banco, abra o <b>extrato</b>, escolha o período e exporte em <b>OFX</b> (melhor) ou <b>CSV</b>. Depois escolha o arquivo aqui. O que já foi importado antes não é duplicado.</div>
   <label class="f">Banco</label><select id="iBank">${banks.map(b=>`<option ${b===bank?'selected':''}>${esc(b)}</option>`).join('')}<option value="__new" ${!banks.length?'selected':''}>+ Vincular novo banco…</option></select>
   <input type="text" id="iNew" placeholder="Nome do banco (ex.: Nubank, Inter, Caixa)" style="margin-top:8px;${banks.length?'display:none':''}">
   <label class="f">Arquivo do extrato (.ofx ou .csv)</label><input type="file" id="iFile" accept=".ofx,.qfx,.csv,.txt,text/csv">
   <label class="ck"><input type="checkbox" id="iPix" checked> Importar só os Pix</label>
   <div id="iPrev"></div></div>`,s=>{
    IMP={rows:[],sel:[]};
    $('#iBank',s).onchange=()=>{$('#iNew',s).style.display=$('#iBank',s).value==='__new'?'':'none'};
    $('#iFile',s).onchange=async()=>{const f=$('#iFile',s).files[0];if(!f)return;const txt=await readText(f);
      let rows=/<OFX>|<STMTTRN>/i.test(txt)?parseOFX(txt):parseCSV(txt);
      if(!rows.length){$('#iPrev',s).innerHTML=`<div class="callout amb" style="margin-top:10px">Não consegui ler lançamentos neste arquivo. Tente exportar em OFX, ou um CSV com colunas de data, valor e descrição.</div>`;return}
      const keys=new Set(allTx().map(t=>t.key).filter(Boolean));
      rows.forEach(r=>{r.key=r.fitid?'f:'+r.fitid:`k:${r.date}|${r.amount}|${norm(r.desc)}`;r.dup=keys.has(r.key);r.cat=guessCat(r.desc,r.type);r.pix=norm(r.desc).includes('pix')});
      rows.sort((a,b)=>b.date.localeCompare(a.date));IMP.rows=rows;drawPrev(s)};
    $('#iPix',s).onchange=()=>drawPrev(s);
  })}
function drawPrev(s){const only=$('#iPix',s).checked;const rows=IMP.rows.filter(r=>!only||r.pix);
  const novos=rows.filter(r=>!r.dup);const P=$('#iPrev',s);
  if(!rows.length){P.innerHTML=`<div class="callout amb" style="margin-top:10px">Encontrei ${IMP.rows.length} lançamento(s), mas nenhum com “Pix” na descrição. Desmarque “Importar só os Pix” para ver todos.</div>`;return}
  P.innerHTML=`<div class="s" style="margin-top:12px"><b>${rows.length}</b> lançamento(s) · <b>${novos.length}</b> novo(s)${rows.length-novos.length?` · ${rows.length-novos.length} já importado(s)`:''} · ${novos.filter(r=>r.cat==='classificar').length} para classificar</div>
   <div class="imp list">${rows.map(r=>{const i=IMP.rows.indexOf(r);const opts=(r.type==='entrada'?INC:CATS).map(c=>`<option value="${c.id}" ${r.cat===c.id?'selected':''}>${c.i} ${c.n}</option>`).join('');
     return `<div class="row ${r.dup?'dup':''}"><input type="checkbox" class="iSel" data-i="${i}" ${r.dup?'':'checked'} style="width:18px;height:18px;accent-color:var(--acc)"><div class="grow"><div class="t small">${esc(r.desc)}</div><div class="s">${dShort(r.date)}${r.dup?' · já importado':''}</div></div><div style="text-align:right"><div class="amt small ${r.type==='entrada'?'pos':''}">${r.type==='entrada'?'+':'−'} ${brl(r.amount)}</div><select class="iCat" data-i="${i}">${opts}</select></div></div>`}).join('')}</div>
   <div class="mf"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" id="iGo">Importar selecionados</button></div>`;
  $$('.iCat',P).forEach(el=>el.onchange=()=>{IMP.rows[+el.dataset.i].cat=el.value});
  $('#iGo',P).onclick=()=>{let bank=$('#iBank',s).value;if(bank==='__new'){bank=$('#iNew',s).value.trim();if(!bank){toast('Dê um nome ao banco');$('#iNew',s).focus();return}}
    const sel=$$('.iSel',P).filter(c=>c.checked).map(c=>IMP.rows[+c.dataset.i]);if(!sel.length){toast('Nenhum lançamento selecionado');return}
    const keys=new Set(['settings']);sel.forEach(r=>keys.add(addTx({id:uid(),type:r.type,amount:Math.round(r.amount*100)/100,date:r.date,desc:r.desc,cat:r.cat,method:r.pix?'pix':'outro',bank,vehicle:'',src:'import',key:r.key})));
    S.settings.banks=S.settings.banks||[];if(!S.settings.banks.includes(bank))S.settings.banks.push(bank);S.settings.lastImport=S.settings.lastImport||{};S.settings.lastImport[bank]=today();
    save([...keys]);closeModal();const pend=sel.filter(r=>r.cat==='classificar').length;cur=ymOf(sel[0].date);render();
    toast(`${sel.length} lançamento(s) importado(s)${pend?` · ${pend} para classificar`:''}`);if(pend)setTimeout(openClassify,700)}}

/* ---------- classificar ---------- */
function openClassify(){
  const list=allTx().filter(t=>t.type==='saida'&&t.cat==='classificar').sort((a,b)=>b.date.localeCompare(a.date));
  if(!list.length){closeModal();toast('Tudo classificado ✅');render();return}
  openModal(`${head('Classificar lançamentos')}<div class="small muted">Escolha a categoria de cada um. Marque “lembrar” para eu acertar sozinho da próxima vez que aparecer a mesma descrição.</div>
   <div class="list" style="margin-top:6px">${list.map(t=>`<div class="row" style="flex-wrap:wrap"><div class="grow" style="min-width:60%"><div class="t small">${esc(t.desc||'Sem descrição')}</div><div class="s">${dNice(t.date)} · ${brl(t.amount)}${t.bank?' · '+esc(t.bank):''}</div></div>
    <div style="display:flex;gap:6px;align-items:center;width:100%"><select class="cCat" data-id="${t.id}" style="flex:1"><option value="">Escolher categoria…</option>${CATS.filter(c=>c.id!=='classificar').map(c=>`<option value="${c.id}">${c.i} ${c.n}</option>`).join('')}</select>
    <label class="ck small" style="margin:0;white-space:nowrap" title="Lembrar: ${esc(keyFromDesc(t.desc))}"><input type="checkbox" class="cRem" data-id="${t.id}"> lembrar</label></div></div>`).join('')}</div>
   <div class="mf"><button class="btn pri" data-act="close">Pronto</button></div>`,s=>{
    $$('.cCat',s).forEach(el=>el.onchange=()=>{if(!el.value)return;const f=findTx(el.dataset.id);if(!f)return;f.t.cat=el.value;const keys=['m-'+f.M];
      const rem=$(`.cRem[data-id="${el.dataset.id}"]`,s);let more=[];if(rem&&rem.checked){more=addRule(keyFromDesc(f.t.desc),el.value)}
      save(keys.concat(more));render();if(more.length>1){openClassify();toast('Regra criada e aplicada aos parecidos')}else{el.closest('.row').style.opacity=.45}})})}

/* ---------- mais: backup, csv, regras, bancos ---------- */
let dlNs;async function getDl(){if(dlNs!==undefined)return dlNs;try{dlNs=(window.claude&&typeof claude.use==='function')?await claude.use('downloads'):null}catch(e){dlNs=null}return dlNs}
async function download(filename,data){if(MODE==='hosted'){const u=URL.createObjectURL(new Blob([data],{type:filename.endsWith('.csv')?'text/csv':'application/json'}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Arquivo baixado');return}
  const d=await getDl();
  if(d){try{await d.save({filename,data});toast('Arquivo pronto');return}catch(e){if(e&&e.code==='declined')return;console.warn(e)}}
  openModal(`${head('Copie o conteúdo')}<div class="small muted" style="margin-bottom:8px">Não consegui baixar o arquivo aqui. Copie o texto abaixo e salve como <b>${esc(filename)}</b>.</div><textarea readonly id="dlTxt">${esc(data)}</textarea><div class="mf"><button class="btn pri" id="cpy">Copiar</button></div>`,s=>{$('#cpy',s).onclick=async()=>{try{await navigator.clipboard.writeText(data);toast('Copiado')}catch(e){$('#dlTxt',s).select();toast('Selecione e copie')}}})}
function doBackup(){download(`meu-bolso-backup-${today()}.json`,JSON.stringify({app:'meubolso',v:1,exported:today(),data:S},null,1))}
function doCSV(){const rows=allTx().sort((a,b)=>a.date.localeCompare(b.date));const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='﻿'+['Data;Tipo;Valor;Descrição;Categoria;Forma;Banco;Veículo'].concat(rows.map(t=>[dShort(t.date)+'/'+t.date.slice(0,4),t.type==='entrada'?'Entrada':'Saída',fmtNum(t.amount),q(t.desc),catOf(t.cat).n,methodName(t.method),q(t.bank||''),t.vehicle||''].join(';'))).join('\r\n');
  download(`meu-bolso-movimentos-${today()}.csv`,csv)}
function doRestore(){openModal(`${head('Restaurar backup')}<div class="small muted">Escolha o arquivo .json baixado em “Baixar backup”. Isso substitui os dados atuais.</div><input type="file" id="rFile" accept=".json,application/json" style="margin-top:12px">`,s=>{
  $('#rFile',s).onchange=async()=>{try{const j=JSON.parse(await readText($('#rFile',s).files[0]));if(!j||j.app!=='meubolso'||!j.data)throw 0;
    const old=keysAll();S=fixState(j.data);const ks=new Set([...old,...keysAll()]);ks.forEach(k=>{if(k.startsWith('m-'))ensureMonth(k.slice(2))});save([...ks]);closeModal();render();toast('Backup restaurado')}catch(e){toast('Arquivo de backup inválido')}}})}
function doWipe(){confirmBox('Apagar <b>todos</b> os lançamentos, contas, eventos e regras? Isso não tem volta — se quiser, baixe um backup antes.','Apagar tudo',()=>{const ks=keysAll();const months=Object.keys(S.months);S=emptyState();months.forEach(m=>ensureMonth(m));save(ks);render();toast('Tudo apagado')})}

/* ---------- ações (cliques) ---------- */
const ACT={
  tab:d=>go(d.tab),close:closeModal,
  newTx:d=>openTx(null,{type:d.type||'saida'}),editTx:d=>openTx(d.id),
  newBill:()=>openBill(null),editBill:d=>openBill(d.id),pay:d=>openPay(d.id,d.m),unpay:d=>unpay(d.id,d.m),
  newEv:d=>openEvent(null,d.date||selDay||''),editEv:d=>openEvent(d.id),
  day:d=>{selDay=selDay===d.date?null:d.date;render()},
  import:d=>openImport(d.bank),classify:openClassify,
  filter:d=>{txFilter=d.f;render()},filterGo:d=>{txFilter=d.f;go('movimentos')},
  delRule:d=>{S.settings.rules.splice(+d.i,1);save('settings');render()},
  delBank:d=>confirmBox(`Desvincular “${esc(d.bank)}”? Os lançamentos já importados continuam.`,'Desvincular',()=>{S.settings.banks=S.settings.banks.filter(b=>b!==d.bank);save('settings');render()}),
  resync:()=>initSb(),logout:doLogout,askNotify,admReload:()=>loadAdmin(),admBlock:d=>{if(d.b==='1')confirmBox('Bloquear esta pessoa? Ela não vai mais conseguir abrir os dados dela até você desbloquear.','Bloquear',()=>admBlock(d.id,true));else admBlock(d.id,false)},
  backup:doBackup,csv:doCSV,restore:doRestore,wipe:doWipe,
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();e.stopPropagation();f(el.dataset,el)}});
function runSubmit(fm){if(!fm)return;const ev={preventDefault(){},target:fm};if(fm.id==='fRule')return submitRule(fm);if(typeof fm.onsubmit==='function')fm.onsubmit(ev)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-submit]');if(!b)return;e.preventDefault();runSubmit(b.closest('form'))},true);
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const t=e.target;if(!(t instanceof HTMLInputElement)||['checkbox','radio','file'].includes(t.type))return;const fm=t.closest('form');if(fm){e.preventDefault();runSubmit(fm)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='fRule')submitRule(e.target)});
function submitRule(fm){if(!fm.kw.value.trim()){toast('Digite a palavra');return}const ks=addRule(fm.kw.value,fm.cat.value);if(ks.length){save(ks);render();toast('Regra adicionada')}}

/* ---------- início ---------- */
loadLocal();
{const h=location.hash.slice(1);if(TABS.includes(h))tab=h}
render();
initSb();
setInterval(()=>{if(document.visibilityState==='visible')refresh()},120000);
setInterval(()=>{if($('#modal').classList.contains('hidden')&&document.visibilityState==='visible')render()},5*60*1000);
</script>
