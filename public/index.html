  const row=b=>{const o=subOff(b)?null:(lateOcc(b)[0]||nextOcc(b));const c=catOf(b.cat);const paid=Object.values(b.paid||{}).length;const spent=tot(Object.values(b.paid||{}).map(v=>{const f=findTx(txIdOf(v));return f?+f.t.amount:+b.amount}));
    return `<div class="row click" data-act="editBill" data-id="${b.id}"><div class="ic">${c.i}</div><div class="grow"><div class="t">${esc(b.name)}</div><div class="s">${FREQ[b.freq||'mensal'].n} · ${esc(c.n)}${b.bank?' · '+esc(b.bank):''}</div><div class="s">${subOff(b)?`<span class="badge b-mute">Cancelada</span> desde ${dFull(b.cancel||b.end)}`:`<span class="badge b-ok">Ativa</span> próxima ${o?dFull(o.due):'—'} ${o?statusBadge(o):''}`}${paid?` · pago ${paid}x (${brl(spent)})`:''}</div></div><div style="text-align:right"><div class="amt">${brl(b.amount)}</div>${subOff(b)?`<button class="btn sm" data-act="subOn" data-id="${b.id}" style="margin-top:4px">Reativar</button>`:`<button class="btn sm danger" data-act="subOff" data-id="${b.id}" style="margin-top:4px">Cancelar</button>`}</div></div>`};
  h+=`<div class="card"><h2>📺 Assinaturas e cobranças recorrentes</h2>${act.length?`<div class="list">${act.map(row).join('')}</div>`:'<div class="empty">Netflix, Spotify, academia, internet, apps… cadastre aqui e eu aviso antes de cobrar.</div>'}</div>`;
  if(can.length)h+=`<details class="card"><summary style="cursor:pointer;font-weight:600">Canceladas (${can.length})</summary><div class="list">${can.map(row).join('')}</div></details>`;return h}
function vHist(){const L=[];S.bills.items.forEach(b=>Object.entries(b.paid||{}).forEach(([k,v])=>{const f=findTx(txIdOf(v));const g=b.group&&groupOf(b.group);

let agView='mes',agF='tudo';
function salaryDay(){const s=lastSalary();return s?Number(s.date.slice(8)):0}
function dayItems(ds){const M=ymOf(ds),td=today();const it=[];
  const fin=agF!=='eventos';if(fin&&agF!=='entradas'&&agF!=='saidas'){billsFor(M).forEach(x=>{if(x.due!==ds)return;it.push({k:'9',dot:x.paid?'paid':x.due<td?'late':'bill',h:`<div class="row click" data-act="${x.group?'editGroup':'editBill'}" data-id="${x.group?x.group.id:x.b.id}"><div class="ic">${entryIcon(x)}</div><div class="grow"><div class="t">${esc(x.group?x.group.name:x.label)}</div><div class="s">${x.paid?'<span class="badge b-ok">Paga</span>':x.due<td?'<span class="badge b-red">Atrasada</span>':'<span class="badge b-amb">A pagar</span>'}</div></div><div style="text-align:right"><div class="amt">${brl(x.amt)}</div>${x.paid?'':`<button class="btn sm pri" data-act="pay" data-id="${x.b.id}" data-m="${x.M}" data-k="${x.key}" style="margin-top:4px">Paguei</button>`}</div></div>`})});
  }
  if(fin&&agF!=='contas'){monthTx(M).filter(t=>t.date===ds&&!t.billId&&(agF!=='entradas'||t.type==='entrada')&&(agF!=='saidas'||t.type==='saida')).forEach(t=>it.push({k:'8',dot:t.type==='entrada'?'in':'out',h:txRow(t)}));
    expIncomes(M).filter(e=>e.date===ds&&!e.got).forEach(e=>it.push({k:'7',dot:'exp',h:`<div class="row click" data-act="nsettings"><div class="ic">${catOf(e.cat).i}</div><div class="grow"><div class="t">${e.id==='salario'?'Salário previsto':esc(e.name)+' (previsto)'}</div><div class="s">${ds<td?'<span class="badge b-amb">Ainda não registrado</span>':'recebimento esperado · não entra no saldo'}</div></div><div class="amt pos">${brl(e.amount)}</div></div>`}));
  }
  if(agF==='tudo'||agF==='contas'){metas().filter(g=>!g.archived&&g.deadline===ds).forEach(g=>it.push({k:'6',dot:'meta',h:`<div class="row click" data-act="editMeta" data-id="${g.id}"><div class="ic">${esc(g.icon||'🎯')}</div><div class="grow"><div class="t">Prazo da meta: ${esc(g.name)}</div><div class="s">${metaPct(g)}% concluída</div></div></div>`}))}
  if(agF==='tudo'||agF==='eventos')S.events.items.filter(e=>evOnDay(e,ds)).forEach(e=>it.push({k:'0'+(e.time||'00:00'),dot:'ev',c:evtOf(e.type).c,h:evRow(e)}));
  return it.sort((a,b)=>a.k.localeCompare(b.k))}
function vAgenda(){const M=cur,n=dim(M),first=wday(M+'-01'),td=today();const day=selDay||(ymOf(td)===M?td:M+'-01');

     ${it.length?`<div class="list">${it.map(i=>i.h).join('')}</div>`:'<div class="empty-st"><div>🗓️</div>Nada neste dia.</div>'}<div class="mf"><button class="btn sm" data-act="newEv" data-date="${day}">+ Evento neste dia</button><button class="btn sm" data-act="newDebt" data-date="${day}">+ Conta neste dia</button></div></div>`;

  else{const items=[];for(let d=1;d<=n;d++){const ds=M+'-'+pad(d);dayItems(ds).forEach(i=>{if(i.dot!=='in'&&i.dot!=='out')items.push({ds,h:i.h})})}
    const evs=S.events.items.filter(e=>ymOf(e.date)===M&&(e.type==='servico'||e.type==='plantao24'));
    h+=`<div class="card"><h2>Tudo em ${mLabel(M)}</h2>${evs.length&&(agF==='tudo'||agF==='eventos')?`<div class="s" style="margin-bottom:4px">💼 ${evs.length} dia(s) de serviço neste mês</div>`:''}${items.length?`<div class="list">${items.map((x,i)=>`${i===0||items[i-1].ds!==x.ds?`<div class="s dsep">${dNice(x.ds)}</div>`:''}${x.h}`).join('')}</div>`:'<div class="empty">Nada marcado.</div>'}</div>`}
  h+='</div></div>';return h+agendaNote()}
function agendaNote(){return (MODE==='hosted'&&!me.admin)?`<div class="callout small">🔔 <b>Avisos:</b> o que tem <b>hoje</b> e <b>amanhã</b> (eventos, dias de serviço e contas) aparece no sino 🔔 lá em cima. Ative os avisos do navegador em <b>Mais</b>.</div>`:`<div class="callout small">🔔 <b>Avisos:</b> todo dia de manhã você recebe uma notificação no celular com o que tem <b>amanhã</b> e o que é <b>hoje</b>. No app eles aparecem no sino 🔔.</div>`}

/* ================= SIMULADOR: juros, empréstimo, financiamento, à vista × parcelado ================= */
let SIMK='compra';
const pmt=(pv,i,n)=>i>0?pv*i/(1-Math.pow(1+i,-n)):pv/n;
function rateOf(pv,p,n){if(p*n<=pv+0.005)return 0;let lo=0,hi=1;for(let k=0;k<80;k++){const mid=(lo+hi)/2;pmt(pv,mid,n)>p?hi=mid:lo=mid}return (lo+hi)/2}
function pctTxt(i){return (i*100).toLocaleString('pt-BR',{maximumFractionDigits:2})+'% a.m.'}

/* ================= SEGURANÇA: bloqueio com senha e biometria (neste aparelho) ================= */
const LOCKK='tico.lock';let unlocked=false,hiddenAt=0;
function lockCfg(){try{return JSON.parse(localStorage.getItem(LOCKK)||'null')}catch(e){return null}}
async function shaHex(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const b64u=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const bioAvail=()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
async function bioRegister(){const ch=crypto.getRandomValues(new Uint8Array(32)),id=crypto.getRandomValues(new Uint8Array(16));
  const c=await navigator.credentials.create({publicKey:{challenge:ch,rp:{name:'Tico Finances'},user:{id,name:'tico',displayName:'Tico Finances'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});return b64u(c.rawId)}
async function bioCheck(cid){const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:ub64(cid),transports:['internal']}],userVerification:'required',timeout:60000}});return !!a}
function showLock(){const L=lockCfg();if(!L||unlocked)return;let el=$('#lock');if(!el){el=document.createElement('div');el.id='lock';document.body.appendChild(el)}let pin='';
  const draw=msg=>{el.innerHTML=`<div class="lk"><div class="logo" style="width:72px;height:72px;border-radius:22px;margin:0 auto 12px"><img class="tico" alt="" src="${TICO}"></div><h3>Tico bloqueado</h3><div class="s" style="margin:4px 0 14px">${msg||'Digite sua senha do app'}</div>
    <div class="pins">${[0,1,2,3,4,5].slice(0,L.len||4).map(i=>`<i class="${i<pin.length?'on':''}"></i>`).join('')}</div>
    <div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')}${L.bio&&bioAvail()?'<button type="button" data-k="bio" class="kb">☝️</button>':'<span></span>'}<button type="button" data-k="0">0</button><button type="button" data-k="del" class="kb">⌫</button></div>
    <button type="button" class="btn sm" id="lkForgot" style="margin-top:14px">Esqueci a senha</button></div>`;
    $$('[data-k]',el).forEach(b=>b.onclick=()=>key(b.dataset.k));$('#lkForgot',el).onclick=()=>{if(MODE==='hosted'){if(confirm('Para tirar o bloqueio você vai sair da conta e entrar de novo com e-mail e senha. Continuar?')){localStorage.removeItem(LOCKK);doLogout()}}else{draw('Peça para remover o bloqueio em Mais → Segurança em outro aparelho')}}};
  const ok=()=>{unlocked=true;el.remove()};
  const key=async k=>{if(k==='bio'){try{if(await bioCheck(L.bio))ok()}catch(e){draw('Biometria não confirmou. Use a senha.')}return}
    if(k==='del'){pin=pin.slice(0,-1);draw();return}if(pin.length>=(L.len||4))return;pin+=k;draw();
    if(pin.length===(L.len||4)){const h=await shaHex(L.salt+pin);if(h===L.hash)ok();else{pin='';draw('Senha incorreta, tente de novo');el.querySelector('.pins').classList.add('shake')}}};
  draw();setTimeout(updateLogos,0);if(L.bio&&bioAvail())setTimeout(()=>key('bio'),400)}
document.addEventListener('keydown',e=>{const el=$('#lock');if(!el)return;if(/^\d$/.test(e.key)){const b=el.querySelector(`[data-k="${e.key}"]`);if(b)b.click()}else if(e.key==='Backspace'){const b=el.querySelector('[data-k="del"]');if(b)b.click()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')hiddenAt=Date.now();else if(lockCfg()&&hiddenAt&&Date.now()-hiddenAt>5*60*1000){unlocked=false;showLock()}});
function openSecurity(){const L=lockCfg();
  openModal(`${head('🔐 Segurança')}<div class="small muted">O bloqueio vale para <b>este aparelho</b>: ao abrir o Tico (ou voltar depois de 5 minutos), ele pede a senha do app${bioAvail()?' ou a biometria (digital / rosto)':''}.</div>
   ${L?`<div class="callout ok small" style="margin-top:12px">✅ Bloqueio ativado com senha de ${L.len||4} dígitos${L.bio?' e biometria':''}.</div><div class="mf" style="justify-content:flex-start">${bioAvail()&&!L.bio?'<button type="button" class="btn" id="sBio">☝️ Ativar biometria</button>':''}<button type="button" class="btn" id="sChange">Trocar senha</button><button type="button" class="btn danger" id="sOff">Desativar bloqueio</button></div>`:
   `<form novalidate id="fLock"><label class="f">Crie uma senha de 4 a 6 números</label><input type="password" name="p" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="••••"><label class="f">Repita a senha</label><input type="password" name="p2" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="••••">
    ${bioAvail()?'<label class="ck"><input type="checkbox" name="bio" checked> Usar também a biometria do aparelho (se tiver)</label>':''}<div class="mf"><button type="button" class="btn pri" data-submit="1">Ativar bloqueio</button></div></form>`}
   <div class="sep"></div><div class="small muted">🛡️ Proteção dos dados: tudo fica salvo na nuvem na sua conta e também neste aparelho. Antes de importar extrato, restaurar backup, apagar ou excluir algo importante, eu guardo um <b>ponto de restauração</b> — veja em Mais → Histórico de alterações.</div>`,s=>{
    const fm=$('#fLock',s);if(fm)fm.onsubmit=async()=>{const p=fm.p.value.trim();if(!/^\d{4,6}$/.test(p)){toast('Use de 4 a 6 números');return}if(p!==fm.p2.value.trim()){toast('As senhas não são iguais');return}
      const salt=b64u(crypto.getRandomValues(new Uint8Array(12)));const cfg={salt,hash:await shaHex(salt+p),len:p.length};
      if(fm.bio&&fm.bio.checked){try{cfg.bio=await bioRegister()}catch(e){toast('Biometria não ativada — fica só a senha')}}
      localStorage.setItem(LOCKK,JSON.stringify(cfg));unlocked=true;logAct('Ativou o bloqueio do app neste aparelho');save('settings');openSecurity();toast('Bloqueio ativado 🔐')};
    const off=$('#sOff',s);if(off)off.onclick=()=>confirmBox('Desativar o bloqueio por senha neste aparelho?','Desativar',()=>{localStorage.removeItem(LOCKK);toast('Bloqueio desativado')});
    const ch=$('#sChange',s);if(ch)ch.onclick=()=>{localStorage.removeItem(LOCKK);openSecurity()};
    const bi=$('#sBio',s);if(bi)bi.onclick=async()=>{try{const c=lockCfg();c.bio=await bioRegister();localStorage.setItem(LOCKK,JSON.stringify(c));toast('Biometria ativada');openSecurity()}catch(e){toast('Não deu para ativar a biometria aqui')}}})}

  openModal(`<form novalidate id="fBal">${head('🏦 Saldo da conta')}<label class="f">Banco ou conta</label><select name="b">${banks.map(b=>`<option value="${esc(b)}" ${b===bank?'selected':''}>${b===WALLET?'👛':'🏦'} ${esc(b)}</option>`).join('')}<option value="__new" ${!bank&&!accounts().length?'selected':''}>+ Novo banco…</option></select><input type="text" name="nb" placeholder="Nome do banco (ex.: Nubank, Inter)" style="margin-top:8px;display:none">
   <label class="f">Quanto tem nessa conta agora (R$)</label><input type="text" class="big" name="v" inputmode="decimal" placeholder="0,00" value="${cur_!=null?fmtNum(cur_):''}">
   <div class="s" id="balInfo" style="margin-top:6px">${B?`Último saldo: ${brl(B.value)} em ${dFull(B.date)} (${B.src==='extrato'?'do extrato':'informado'}) · agora calculado: <b>${brl(cur_)}</b>`:'A partir daqui, cada gasto, recebimento e conta paga nessa conta atualiza o saldo sozinho.'}</div>
   <label class="ck"><input type="checkbox" name="def" ${defBank()===bank&&bank?'checked':''}> Conta principal (usada quando o lançamento não diz o banco)</label>
   <div class="mf">${B?'<button type="button" class="btn danger" id="balDel">Remover saldo</button>':''}<button type="button" class="btn pri" data-submit="1">Salvar</button></div></form>`,s=>{const fm=$('#fBal',s);
    const sync=()=>{fm.nb.style.display=fm.b.value==='__new'?'':'none'};sync();
    fm.b.onchange=()=>{sync();if(fm.b.value!=='__new'){openSetBal2(fm.b.value)}};
    fm.onsubmit=()=>{const b=fm.b.value==='__new'?fm.nb.value.trim():fm.b.value;const v=parseMoney(fm.v.value);if(!b){toast('Escreva o nome do banco');return}if(isNaN(v)||Math.abs(v)>1e8){toast('Informe o valor');return}
      mark(`Atualizou o saldo de ${b} para ${brl(v)}`);S.settings.balances=S.settings.balances||{};S.settings.balances[b]={value:r2(v),date:today(),at:Date.now(),src:'manual'};regBank(b);if(fm.def.checked)S.settings.defBank=b;else if(S.settings.defBank===b)delete S.settings.defBank;
      save('settings');closeModal();render();toast('Saldo atualizado')};
    const d=$('#balDel',s);if(d)d.onclick=()=>confirmBox(`Remover o saldo de “${esc(bank)}”? Os lançamentos continuam.`,'Remover',()=>{delete S.settings.balances[bank];save('settings');render()})})}

    const fin=pv-en;let per;if(pp>0&&!(i>0)){per=pp;i=rateOf(fin,pp,n)}else per=pmt(fin,i,n);const tp=radioVal(e,'tp');

function dailyBody(d){const m=money();const due=m.all.filter(x=>x.due===d);const nx=m.all.find(x=>x.due>d);const ex=[ymOf(d)].flatMap(M=>expIncomes(M)).filter(e=>e.date===d&&!e.got);

/* ----- alertas de situação (saldo, gastos, metas, recorrentes): avaliados quando os dados mudam ----- */
function stateAlerts(){const P=np(),now=Date.now(),td=today(),cm=ymOf(td),out=[];const st=NS().state;const add=a=>out.push({at:now,...a});
  const episode=(id,cond,mk)=>{if(cond){if(!st[id]){st[id]=String(now);add(mk(st[id]))}}else if(st[id])delete st[id]};
  const m=money();

  if(budget>0)[[85,'aviso','📊 Você já usou 85% do orçamento do mês'],[100,'alerta','🚨 Seus gastos passaram do limite mensal']].forEach(([p,l,t])=>{if(spent>=budget*p/100)add({key:`bud:${cm}:${p}`,cat:'gastos',lvl:l,link:'movimentos:analise',title:t,body:`Gasto ${brl(spent)} de ${brl(budget)} (${Math.round(spent/budget*100)}%).`})});
  const byC={},prevC={};outM.forEach(t=>{byC[t.cat]=(byC[t.cat]||0)+(+t.amount)});monthTx(addMonths(cm,-1)).filter(t=>counted(t)&&t.type==='saida').forEach(t=>{prevC[t.cat]=(prevC[t.cat]||0)+(+t.amount)});
  Object.entries(P.catLimits).forEach(([c,lim])=>{lim=+lim;if(!(lim>0))return;const v=byC[c]||0;const nm=catOf(c).n.toLowerCase();
    if(v>=lim)add({key:`lim:${c}:${cm}:100`,cat:'gastos',lvl:'alerta',link:'movimentos:analise',title:`🚨 Você passou do limite de ${nm}`,body:`${brl(v)} de ${brl(lim)} neste mês.`});
    else if(v>=lim*0.85)add({key:`lim:${c}:${cm}:85`,cat:'gastos',lvl:'aviso',link:'movimentos:analise',title:`📊 Você já utilizou ${Math.round(v/lim*100)}% do orçamento destinado a ${nm}.`,body:`${brl(v)} de ${brl(lim)} · restam ${brl(lim-v)}.`})});
  Object.entries(byC).forEach(([c,v])=>{const p=prevC[c]||0;if(p>=50&&v>p*1.3&&v-p>=100)add({key:`up:${c}:${cm}`,cat:'gastos',lvl:'aviso',link:'movimentos:analise',title:`⚠️ Seus gastos com ${catOf(c).n.toLowerCase()} aumentaram ${Math.round((v-p)/p*100)}% em comparação ao mês passado.`,body:`${brl(p)} no mês passado → ${brl(v)} neste mês.`})});

  hist.filter(t=>t.date>=addDays(td,-3)&&+t.amount>=Math.max(200,avg*3)&&!t.billId).forEach(t=>add({key:`tx:unusual:${t.id}`,cat:'gastos',lvl:'aviso',link:'tx:'+t.id,title:`👀 Movimentação incomum: ${brl(t.amount)}`,body:`${prettyDesc(t.desc)||catOf(t.cat).n} em ${dFull(t.date)} · bem acima da sua média (${brl(avg)}).`}));
  // gastos recorrentes ainda não cadastrados

  S.bills.items.filter(b=>b.kind==='parcelada').forEach(b=>{const n=+b.installments||1;const lastM=addMonths(ymOf(bFirst(b)),n-1);const oc=occInMonth(b,lastM);if(oc.length&&oc.every(o=>o.paid))add({key:`parc:done:${b.id}`,cat:'cartoes',lvl:'ok',link:'contas:parcelas',title:`🎉 Parcelamento finalizado: ${b.name}`,body:`Todas as ${n} parcelas de ${brl(b.amount)} foram pagas.`})});

function notifTick(){clearTimeout(tickT);if(MODE==='hosted'&&!SYNCED&&!(Date.now()-BOOT>12000))return;const st=NS();const now=Date.now();const first=!st.init;
  const plan=alertPlan(),due=[...plan.filter(a=>a.at<=now),...stateAlerts()];let n=0;
  due.forEach(a=>{if(addNotif(a,first&&QUIET_INIT.test(a.key)))n++});
  if(first)st.init=today();pruneN();
  if(n||first){save('notifs')}else dirty.add('notifs');
  updBell();lastPlan=plan.filter(a=>a.at>now);pushSync();
  const fresh=NEWN.splice(0);if(fresh.length&&!first){const imp=fresh.filter(a=>a.lvl==='alerta'||a.lvl==='aviso');
    if(document.visibilityState==='visible'){if(fresh.length)toastN(fresh)}else localSys(imp.length?imp:fresh)}}

let pushT=null;

  const sig=JSON.stringify(items.map(i=>[i.key,i.send_at,i.body]));if(!force&&sig===pushSync.last)return;
  try{const {data,error}=await sbc.rpc('mb_push_sync',{items,win_end:new Date(Date.now()+15*864e5).toISOString()});if(error)throw error;pushSync.last=sig;pushSync.info=data}catch(e){console.warn('push sync',e)}},force?50:1200)}
const pushSupported=()=>MODE==='hosted'&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;

const u8=b=>{const p='='.repeat((4-b.length%4)%4);const s=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(s,c=>c.charCodeAt(0))};
async function pushState(){if(!pushSupported())return isIOS()&&!isStandalone()?'ios-install':'unsupported';try{const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();if(sub)return 'on';return Notification.permission==='denied'?'denied':'off'}catch(e){return 'off'}}

    const reg=(await navigator.serviceWorker.getRegistration())||(await navigator.serviceWorker.register('sw.js'));await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||(await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID_PUB)}));
    const {error}=await sbc.rpc('mb_push_sub',{sub:{...sub.toJSON(),ua:navigator.userAgent.slice(0,200)},enable:true});if(error)throw error;

const hexRGB=h=>{h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255]};

const mixHex=(a,b,t)=>{const A=hexRGB(a),B=hexRGB(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
function themeCfg(){let t=S&&S.settings&&S.settings.theme;if(!t){try{t=JSON.parse(localStorage.getItem('tico.theme')||'null')}catch(e){}}return {...TH_DEF,...(t||{})}}

  const base=THEMES.find(t=>t.id===cfg.base)||THEMES[0];const mode=cfg.mode==='auto'?base.mode:cfg.mode;const acc=cfg.acc||base.acc,sec=cfg.sec||base.sec,hl=cfg.hl||base.hl;
  const light=mode==='light';const bg=light?(base.mode==='light'?base.bg:'#f5f4f7'):(base.mode==='dark'?base.bg:'#08080a');const R=document.documentElement.style;

      :{'--card':'rgba(255,255,255,.035)','--card2':mixHex(bg,'#ffffff',.06),'--solid':mixHex(bg,'#ffffff',.045),'--ink':'#f7f4f8','--mute':'#8f8996','--line':'rgba(255,255,255,.08)','--line2':'rgba(255,255,255,.14)','--soft':'rgba(255,255,255,.06)','--fg':'255,255,255','--input':mixHex(bg,'#ffffff',.02),'--topbg':`rgba(${hexRGB(bg).join(',')},.66)`,'--topbg2':`rgba(${hexRGB(bg).join(',')},.9)`,'--navbg2':`rgba(${hexRGB(mixHex(bg,'#ffffff',.04)).join(',')},.95)`,'--navbg':`rgba(${hexRGB(mixHex(bg,'#ffffff',.05)).join(',')},.8)`,'--in':'#3ddc97','--in2':'rgba(61,220,151,.13)','--out':'#ff5c93','--red':'#ff6b81','--amb':'#ffc078','--shadow':'0 20px 50px -30px rgba(0,0,0,.9)'})};
  const ch={classico:[V['--in'],V['--out'],light?'#7c3aed':'#c4b2ff'],tema:[mixHex(sec,'#ffffff',light?0:.15),acc,light?'#18161d':'#ffffff'],suave:[mixHex(V['--in'],light?'#ffffff':bg,.45),mixHex(V['--out'],light?'#ffffff':bg,.45),mixHex(acc,'#ffffff',.4)]}[cfg.chart]||[V['--in'],V['--out'],'#c4b2ff'];
  V['--cin']=ch[0];V['--cout']=ch[1];V['--cline']=ch[2];

  if(typeof updateLogos==='function')setTimeout(updateLogos,0);const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content',bg);try{localStorage.setItem('tico.theme',sig)}catch(e){}}

/* ================= SALDO REAL × COMPROMETIDO × PROJETADO ================= */
function expBetween(from,to){const out=[];for(let M=ymOf(from),i=0;M<=ymOf(to)&&i<14;M=addMonths(M,1),i++)expIncomes(M).forEach(e=>{if(!e.got&&e.date>=from&&e.date<=to)out.push(e)});return out.sort((a,b)=>a.date.localeCompare(b.date))}
function nextIncome(){const td=today();return expBetween(addDays(td,-3),addDays(td,62))[0]||null}
function projection(until){const td=today(),cm=ymOf(td);until=until||cm+'-'+pad(dim(cm));const m=money();const due=m.all.filter(x=>x.due<=until);const exp=expBetween(addDays(td,-3),until);
  const dueT=r2(tot(due.map(x=>x.amt))),expT=r2(tot(exp.map(e=>e.amount)));return{has:m.hasBal,bal:m.bal,due:dueT,dueList:due,exp:expT,expList:exp,proj:r2(m.bal-dueT+expT),until,late:m.late,lateT:r2(tot(m.late.map(x=>x.amt)))}}
function healthInfo(){const td=today(),cm=ymOf(td),endM=cm+'-'+pad(dim(cm));const m=money(),P=projection(endM),st=mStats(cm);
  const monthBills=billsFor(cm);const paidT=r2(tot(monthBills.filter(x=>x.paid).map(x=>x.amt))),pendM=r2(tot(m.now.map(x=>x.amt)));const totalM=r2(paidT+pendM);
  const cover=totalM>0?Math.min(100,Math.round((paidT+Math.min(Math.max(m.bal,0),pendM))/totalM*100)):100;
  const ni=nextIncome();const riskTo=ni?ni.date:endM;const R=projection(riskTo<td?td:riskTo);const before=r2(m.bal-tot(m.all.filter(x=>x.due<(ni?ni.date:addDays(endM,1))).map(x=>x.amt)));
  const lvl=!m.hasBal?'mute':(m.late.length||before<0)?'red':(P.proj<0||cover<100)?'amb':'ok';
  const msg=!m.hasBal?'Informe o saldo do banco (ou importe o extrato) para eu calcular sua saúde financeira.':lvl==='red'?(m.late.length?`Você tem ${m.late.length} conta(s) vencida(s). Priorize esses pagamentos.`:'Seu saldo pode ficar negativo antes do próximo recebimento.'):lvl==='amb'?'Atenção: o dinheiro atual ainda não cobre todas as contas do mês.':'Tudo em dia: seu saldo cobre as contas do mês.';
  return{m,P,st,paidT,pendM,totalM,cover,ni,before,lvl,msg,expM:r2(tot(expBetween(cm+'-01',endM).map(e=>e.amount)))}}

function delXfer(x){const L=allTx().filter(t=>t.xfer===x);if(!L.length)return;confirmBox(`Excluir esta transferência (${brl(L[0].amount)})? Os dois lados são removidos.`,'Excluir',()=>{mark('Excluiu uma transferência entre contas');const ks=new Set();L.forEach(t=>ks.add(removeTx(t.id)));save([...ks]);render();toast('Transferência excluída')})}

/* ================= MOVIMENTAÇÕES: gastos, transferências e importações ================= */
function vTransf(){const L=allTx().filter(t=>t.cat==='transferencia').sort((a,b)=>b.date.localeCompare(a.date));const seen=new Set();const rows=[];
  L.forEach(t=>{if(t.xfer){if(seen.has(t.xfer))return;seen.add(t.xfer);const pair=L.filter(o=>o.xfer===t.xfer);const o=pair.find(p=>p.type==='saida')||t,i=pair.find(p=>p.type==='entrada')||t;
      rows.push(`<div class="row"><div class="ic">🔁</div><div class="grow"><div class="t">${esc(txBank(o))} → ${esc(txBank(i))}</div><div class="s">${dFull(t.date)}${t.desc?' · '+esc(t.desc):''}</div></div><div class="amt mv">${brl(t.amount)}</div><button class="btn sm danger" data-act="delXfer" data-x="${t.xfer}">✕</button></div>`)}else rows.push(txRow(t,1))});
  return `<div class="actions"><button class="btn pri" data-act="transfer">🔁 Nova transferência</button></div><div class="callout small">Transferências entre suas contas (e as que eu reconheço no extrato) mudam o saldo de cada banco, mas <b>não contam como gasto nem como ganho</b>.</div><div class="card"><h2>Transferências</h2>${rows.length?`<div class="list">${rows.slice(0,80).join('')}</div>`:'<div class="empty-st"><div>🔁</div>Nenhuma transferência ainda.</div>'}</div>`}
function batches(){const by={};allTx().forEach(t=>{if(!t.imp)return;const b=by[t.imp]=by[t.imp]||{id:t.imp,bank:t.bank,n:0,inc:0,out:0,from:t.date,to:t.date,ts:+t.ts||0};b.n++;b[t.type==='entrada'?'inc':'out']+=+t.amount;if(t.date<b.from)b.from=t.date;if(t.date>b.to)b.to=t.date;b.ts=Math.max(b.ts,+t.ts||0)});return Object.values(by).sort((a,b)=>b.ts-a.ts||b.to.localeCompare(a.to))}
function vImports(){const B=batches();return `<div class="actions"><button class="btn pri" data-act="import">📄 Importar extrato</button></div><div class="callout small">Eu leio PDF, Excel, OFX e CSV. Antes de gravar, você confere tudo numa tela de revisão — nada é lançado duas vezes.</div>
  <div class="card"><h2>Importações feitas</h2>${B.length?`<div class="list">${B.map(b=>`<div class="row"><div class="ic">📄</div><div class="grow"><div class="t">${esc(b.bank||'Banco')}</div><div class="s">${b.n} movimentação(ões) · ${dFull(b.from)} a ${dFull(b.to)}${b.ts?' · importado em '+new Date(b.ts).toLocaleDateString('pt-BR'):''}</div><div class="s"><span class="pos">+ ${brl(b.inc)}</span> · − ${brl(b.out)}</div></div><button class="btn sm danger" data-act="undoBatch" data-b="${b.id}">Desfazer</button></div>`).join('')}</div>`:'<div class="empty-st"><div>📄</div>Nenhum extrato importado ainda.</div>'}</div>`}
function undoBatch(id){const L=allTx().filter(t=>t.imp===id);if(!L.length)return;confirmBox(`Desfazer esta importação? ${L.length} movimentação(ões) saem do app${L.some(t=>t.billId)?' e as contas que ela tinha marcado como pagas voltam a ficar pendentes':''}.`,'Desfazer importação',()=>{
  mark(`Desfez a importação de ${L[0].bank||'extrato'} (${L.length} movimentações)`);const ks=new Set(['bills']);L.forEach(t=>{if(t.billId)S.bills.items.forEach(b=>{for(const k in (b.paid||{}))if(txIdOf(b.paid[k])===t.id)delete b.paid[k]});ks.add(removeTx(t.id))});save([...ks]);render();toast('Importação desfeita')})}

let REV=null;
function openReview(r,bankHint){const banks=S.settings.banks||[];const bank=r.bank||bankHint||(banks.length===1?banks[0]:'')||'';
  const keys0=new Set(allTx().map(t=>t.key).filter(Boolean)),seenK=new Set(),used=new Set();const mem=catMemory();const names=myNames(r);
  const rows=r.rows.map((x,i)=>{const key=x.fitid?'f:'+x.fitid:`k:${x.date}|${x.amount}|${norm(x.desc)}`;const dup=keys0.has(key)||seenK.has(key);seenK.add(key);
    const lm=!dup&&linkManual(x,bank||'',used);if(lm)used.add(lm.id);const nd=norm(x.desc);const ruled=(S.settings.rules||[]).find(rr=>kwMatch(nd,rr.kw));let cat,why='';

function tiAnswer(q){const n=norm(q),td=today(),cm=ymOf(td),pm=addMonths(cm,-1),m=money(),st=mStats(cm),ps=mStats(pm),MN=MESES[+cm.slice(5)-1].toLowerCase();const has=k=>k.some(w=>n.includes(w));

  if(has(['sobrou','sobra','comparacao','mes passado','anterior'])){const a=r2(st.inc-st.out),b=r2(ps.inc-ps.out);if(!st.n&&!ps.n)return 'Ainda não há lançamentos suficientes neste mês nem no anterior para comparar.';return `Em ${MN} sobrou <b>${brl(a)}</b> (recebeu ${brl(st.inc)}, gastou ${brl(st.out)}). No mês passado sobrou <b>${brl(b)}</b>. ${a>=b?`Você está <span class="pos">${brl(a-b)} melhor</span>.`:`Você está <span class="red">${brl(b-a)} pior</span>.`} Transferências entre suas contas não entram nessa conta.`}
  if(has(['projet','previs'])){const P=projection();if(!P.has)return noBal;return `Saldo atual: <b>${brl(P.bal)}</b>. Até ${dFull(P.until)}: contas a pagar ${brl(P.due)}, recebimentos previstos ${brl(P.exp)}. Saldo projetado: <b class="${P.proj<0?'red':'pos'}">${brl(P.proj)}</b>.<br><span class="s">Projeção não é dinheiro disponível — os recebimentos previstos só contam quando caírem.</span>`}
  if(has(['meta'])){const G=metas().filter(g=>!g.archived);if(!G.length)return 'Você ainda não tem metas. Crie uma em <b>Metas</b>.';return G.map(g=>`🎯 <b>${esc(g.name)}</b>: ${metaPct(g)}% (${brl(metaSum(g))} de ${brl(g.target)})${g.deadline&&metaPct(g)<100?` · guarde ${brl(Math.max(0,g.target-metaSum(g))/Math.max(1,monthDiff(cm,ymOf(g.deadline))))} por mês até ${dFull(g.deadline)}`:''}`).join('<br>')}
  if(has(['posso gastar','gastar sem','livre'])){if(!m.hasBal)return noBal;const ni=nextIncome();const until=ni?ni.date:cm+'-'+pad(dim(cm));const due=r2(tot(m.all.filter(x=>x.due<=until).map(x=>x.amt)));const free=r2(m.bal-due);const days=Math.max(1,dnum(until)-dnum(td));
    return free<=0?`Agora <b>não sobra nada</b>: você tem ${brl(m.bal)} e precisa pagar ${brl(due)} até ${dFull(until)}${ni?' (quando entra '+esc(ni.name)+')':''}. Faltam <b class="red">${brl(-free)}</b>.`:`Você pode gastar até <b class="pos">${brl(free)}</b> até ${dFull(until)}${ni?` (próximo recebimento: ${esc(ni.name)})`:''} sem atrasar contas — cerca de <b>${brl(free/days)} por dia</b>.`}
  if(has(['guardar','juntar','dividas','divida','quitar'])){const p30=r2(tot(m.all.filter(x=>x.due<=addDays(td,30)).map(x=>x.amt)));const fp=futParc();if(!m.all.length&&!fp.n)return 'Você não tem dívidas nem contas pendentes cadastradas. 🎉';
    return `Pendentes até o fim do mês: <b>${brl(m.pend)}</b>${m.late.length?` (sendo ${brl(r2(tot(m.late.map(x=>x.amt))))} vencidas)`:''}. Nos próximos 30 dias: <b>${brl(p30)}</b>. Parcelas futuras somam ${brl(fp.total)}${fp.last?' até '+dFull(fp.last):''}.${m.hasBal?` Com ${brl(m.bal)} no banco, ${m.bal>=p30?'<span class="pos">você já cobre os próximos 30 dias</span>.':`precisa juntar mais <b class="red">${brl(p30-m.bal)}</b> para os próximos 30 dias.`}`:''}`}
  if(has(['vence','vencem','vencimento','proximas contas','pagar primeiro'])){const L=m.all.slice(0,6);if(!L.length)return 'Nenhuma conta pendente. ✅';return L.map(x=>`${x.due<td?'🔴':'🧾'} <b>${esc(x.group?x.group.name:x.label)}</b> — ${brl(x.amt)} · ${x.due<td?'venceu':'vence'} ${dFull(x.due)}`).join('<br>')}
  if(has(['onde','mais gast','categoria'])){const by={};monthTx(cm).filter(t=>counted(t)&&t.type==='saida').forEach(t=>{by[t.cat]=(by[t.cat]||0)+(+t.amount)});const pv={};monthTx(pm).filter(t=>counted(t)&&t.type==='saida').forEach(t=>{pv[t.cat]=(pv[t.cat]||0)+(+t.amount)});const e=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,4);if(!e.length)return `Nenhum gasto registrado em ${MN} ainda.`;
    return `Em ${MN} (${brl(st.out)} no total):<br>`+e.map(([c,v])=>`${catOf(c).i} <b>${esc(catOf(c).n)}</b>: ${brl(v)} (${Math.round(v/st.out*100)}%)${pv[c]?` · mês passado ${brl(pv[c])}`:''}`).join('<br>')}

function tiSuggestions(){const out=[];const td=today(),cm=ymOf(td),m=money();
  const by={},pv={};monthTx(cm).filter(t=>counted(t)&&t.type==='saida').forEach(t=>{by[t.cat]=(by[t.cat]||0)+(+t.amount)});monthTx(addMonths(cm,-1)).filter(t=>counted(t)&&t.type==='saida').forEach(t=>{pv[t.cat]=(pv[t.cat]||0)+(+t.amount)});
  Object.entries(by).filter(([c,v])=>pv[c]>=50&&v>pv[c]).sort((a,b)=>(b[1]-pv[b[0]])-(a[1]-pv[a[0]])).slice(0,2).forEach(([c,v])=>out.push({i:'📈',t:`Você gastou mais com ${catOf(c).n.toLowerCase()} neste mês (${brl(v)}) do que no mês anterior (${brl(pv[c])}).`,a:['goAn','Ver análise']}));
  const soon=m.all.filter(x=>x.due>=td&&dnum(x.due)-dnum(td)<=7);if(soon.length)out.push({i:'⏰',t:`Existem ${soon.length} conta(s) próximas do vencimento (${brl(tot(soon.map(x=>x.amt)))} nos próximos 7 dias).`,a:['tabPt','Ver contas','contas','prox']});

  metas().filter(g=>!g.archived&&metaPct(g)>=80&&metaPct(g)<100).forEach(g=>out.push({i:'🎯',t:`Você está próximo de alcançar a meta “${esc(g.name)}” (${metaPct(g)}%). Faltam ${brl(g.target-metaSum(g))}.`,a:['editMeta','Abrir meta',g.id]}));
  recurringCandidates().slice(0,4).forEach(r=>out.push({i:'🔁',t:`“${esc(titleCase(r.k))}” aparece todo mês (${r.var?'em média ':''}${brl(r.md)}, por volta do dia ${r.day}). Quer transformar em despesa recorrente?`,a:['mkRec','Transformar em recorrente',r.k]}));
  const cls=allTx().filter(t=>t.cat==='classificar').length;if(cls)out.push({i:'❓',t:`${cls} lançamento(s) estão sem categoria. Classificando, eu aprendo e acerto sozinho da próxima vez.`,a:['classify','Classificar']});

function recurringCandidates(){const cm=ymOf(today());const rec={};allTx().filter(t=>counted(t)&&t.type==='saida'&&t.date>=addMonths(cm,-4)+'-01'&&!t.billId).forEach(t=>{const k=keyFromDesc(t.desc);if(!k||k.length<3)return;(rec[k]=rec[k]||[]).push(t)});
  const ign=new Set(S.settings.recIgnore||[]);const out=[];Object.entries(rec).forEach(([k,L])=>{const ms=new Set(L.map(t=>ymOf(t.date)));if(ms.size<2||ign.has(k))return;
    if(S.bills.items.some(b=>norm(b.name).includes(norm(k))||norm(k).includes(norm(b.name))))return;const vs=L.map(t=>+t.amount).sort((a,b)=>a-b),md=vs[Math.floor(vs.length/2)];const varr=vs.some(v=>Math.abs(v-md)>md*0.05);if(vs.some(v=>Math.abs(v-md)>md*0.5))return;
    const days=L.map(t=>+t.date.slice(8)).sort((a,b)=>a-b);const last=L.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];out.push({k,md:r2(md),var:varr,day:days[Math.floor(days.length/2)],cat:last.cat,bank:txBank(last),n:ms.size})});
  return out.sort((a,b)=>b.n-a.n||b.md-a.md)}

function impCfg(){return{auto:true,remind:7,...(S.settings.imp||{})}}

function daysSince(d){return d?Math.max(0,Math.round((dnum(today())-dnum(d)))):null}

/* conta certa sem perguntar: lembra a escolha feita para cada banco detectado, ou acha a conta com nome parecido */
function resolveBank(r,hint){if(hint)return hint;const accs=accounts().filter(a=>a!==WALLET);const det=r.bank||'';const map=S.settings.bankMap||{};
  if(det&&map[norm(det)]&&accs.includes(map[norm(det)]))return map[norm(det)];
  if(det&&accs.includes(det))return det;
  if(det){const L=accs.filter(a=>norm(a).includes(norm(det).split(' ')[0])||norm(det).includes(norm(a).split(' ')[0]));if(L.length===1)return L[0]}

  subOff:d=>{const b=S.bills.items.find(x=>x.id===d.id);if(b)confirmBox(`Cancelar a assinatura “${esc(b.name)}”? Ela para de ser cobrada a partir de hoje. O histórico de pagamentos fica guardado.`,'Cancelar assinatura',()=>{mark(`Cancelou a assinatura “${b.name}”`);b.end=today()<bFirst(b)?bFirst(b):today();b.cancel=today();save('bills');render();toast('Assinatura cancelada')})},
  subOn:d=>{const b=S.bills.items.find(x=>x.id===d.id);if(b){mark(`Reativou a assinatura “${b.name}”`);b.end='';delete b.cancel;save('bills');render();toast('Assinatura reativada')}},
  newMeta:d=>openMeta(null,d.tpl!=null?+d.tpl:null),editMeta:d=>openMeta(d.id),metaDep:d=>openDep(d.id,!!d.neg),
  metaDepDel:d=>{const g=metas().find(x=>x.id===d.id);if(!g)return;confirmBox('Excluir este depósito da meta?','Excluir',()=>{mark('Excluiu um depósito da meta “'+g.name+'”');g.deps=(g.deps||[]).filter(x=>x.id!==d.d);save('settings');render();openMeta(g.id)})},
  simK:d=>{SIMK=d.k;render()},agView:d=>{agView=d.v;render()},agF:d=>{agF=d.v;render()},agDay:d=>{const base=selDay||(ymOf(today())===cur?today():cur+'-01');selDay=addDays(base,+d.d);cur=ymOf(selDay);render()},
  search:()=>openSearch(),notifs:()=>openNotifs(),nsettings:()=>openNotifSettings(),hideVals:()=>{HIDE=!HIDE;try{localStorage.setItem('tico.hide',HIDE?'1':'')}catch(e){}applyHide()},profile:()=>{closeModal();go('mais')},
  fab:()=>openFab(),goSim:()=>go('simular'),tabPt:d=>{if(d.tab==='movimentos')movTab=d.pt;else if(d.tab==='contas')payTab=d.pt;else if(d.tab==='analises')anTab=d.pt;closeModal();go(d.tab)},accounts:()=>openAccounts(),transfer:()=>{closeModal();openTransfer()},delXfer:d=>delXfer(d.x),undoBatch:d=>undoBatch(d.b),appearance:()=>openAppearance(),brand:()=>openBrand(),anTab:d=>{anTab=d.t;render()},tiAsk:d=>tiAsk(TIQ[+d.i]),mkRec:d=>mkRec(d.k),recIgn:d=>{S.settings.recIgnore=[...(S.settings.recIgnore||[]),d.k];save('settings');render()},navCollapse:toggleNav,history:openHistory,security:openSecurity,
});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();e.stopPropagation();f(el.dataset,el)}});
function runSubmit(fm){if(!fm)return;const ev={preventDefault(){},target:fm};if(fm.id==='fRule')return submitRule(fm);if(typeof fm.onsubmit==='function')fm.onsubmit(ev)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-submit]');if(!b)return;e.preventDefault();runSubmit(b.closest('form'))},true);
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const t=e.target;if(!(t instanceof HTMLInputElement)||['checkbox','radio','file'].includes(t.type))return;const fm=t.closest('form');if(fm){e.preventDefault();runSubmit(fm)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='fRule')submitRule(e.target)});
function submitRule(fm){if(!fm.kw.value.trim()){toast('Digite a palavra');return}const ks=addRule(fm.kw.value,fm.cat.value);if(ks.length){save(ks);render();toast('Regra adicionada')}}

initSb();
if(MODE!=='hosted')setTimeout(()=>{if(!dirty.size)maybeAskSalary()},4000);
setInterval(()=>{if(document.visibilityState==='visible')refresh()},120000);
setInterval(()=>{if($('#modal').classList.contains('hidden')&&document.visibilityState==='visible')render()},5*60*1000);
